<script>
  // 這裡新增：過濾 Tailwind CDN 在正式環境顯示的提醒訊息，不影響其他 console 訊息
  (function(){
    const originalWarn = console.warn;
    console.warn = function(...args){
      if(args.length && typeof args[0] === "string" && args[0].includes("cdn.tailwindcss.com")) return;
      originalWarn.apply(console, args);
    };
  })();
</script>

  @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to {opacity:1; transform:translateY(0);} }

<style>

.genealogy-breeding { display:grid; gap:18px; }

.genealogy-tree-card,.genealogy-info-card,.genealogy-trace-card { background:#fff; border:1px solid #e5e7eb; border-radius:18px; padding:20px; box-shadow:0 6px 18px rgba(0,0,0,.04); }

.g-node.selected,.g-node.trace { border-color:#16a34a; box-shadow:0 0 0 4px rgba(22,163,74,.10); }
.g-node .gen { font-size:12px; color:#6b7280; margin-top:4px; }

.g-children { display:flex; gap:34px; justify-content:center; position:relative; margin-top:34px; }
.g-children:before { content:""; position:absolute; top:-18px; left:10%; right:10%; height:1px; background:#d1d5db; }
.g-child-wrap { position:relative; padding-top:18px; }

<script>
/* ===== 珍稀植物繁育管理：只供家族族譜頁使用 ===== */
const RARE_BREEDING_DATA = [
  {id:'PL-001', name:'二叉鹿角蕨 #001', species:'二叉鹿角蕨', generation:1, method:'原始母株', parent:null, rarity:5},
  {id:'PL-002', name:'二叉鹿角蕨 A-01', species:'二叉鹿角蕨', generation:2, method:'側芽繁殖', parent:'PL-001', rarity:4},
  {id:'PL-003', name:'二叉鹿角蕨 A-02', species:'二叉鹿角蕨', generation:2, method:'側芽繁殖', parent:'PL-001', rarity:4},
  {id:'PL-004', name:'二叉鹿角蕨 A-01-01', species:'二叉鹿角蕨', generation:3, method:'分株繁殖', parent:'PL-002', rarity:4},
  {id:'PL-005', name:'二叉鹿角蕨 A-01-01-01', species:'二叉鹿角蕨', generation:4, method:'分株繁殖', parent:'PL-004', rarity:5}
];

function genealogyNodeHTML(p, selectedId){
  const stars='★'.repeat(p.rarity)+'☆'.repeat(5-p.rarity);
  return `<div class="g-node ${p.id===selectedId?'selected':''}" onclick="selectGenealogyPlant('${p.id}')">
    <div style="font-size:22px">🌱</div>
    <strong>${p.name}</strong>
    <div style="font-size:13px;color:#6b7280">${p.species}</div>
    <div class="gen">第 ${p.generation} 代 · ${p.id}</div>
    <span class="method">${p.method}</span>
    <div style="margin-top:8px;font-size:12px">珍稀程度 ${stars}</div>
  </div>`;
}
function buildGenealogyTree(selectedId='PL-005'){
  const byId=Object.fromEntries(RARE_BREEDING_DATA.map(x=>[x.id,x]));
  const children={}; RARE_BREEDING_DATA.forEach(x=>{if(x.parent)(children[x.parent]??=[]).push(x.id)});
  function branch(id){
    const p=byId[id], kids=children[id]||[];
    return `<div class="g-child-wrap">${genealogyNodeHTML(p,selectedId)}
      ${kids.length?`<div class="g-children">${kids.map(branch).join('')}</div>`:''}
    </div>`;
  }
  const root=RARE_BREEDING_DATA.find(x=>!x.parent);
  return `<div class="g-tree">${branch(root.id)}</div>`;
}
function genealogyTrace(selectedId='PL-005'){
  const byId=Object.fromEntries(RARE_BREEDING_DATA.map(x=>[x.id,x]));
  const path=[]; let cur=byId[selectedId];
  while(cur){path.unshift(cur);cur=cur.parent?byId[cur.parent]:null;}
  return path.map((p,i)=>`<div class="g-trace-item ${i===0||i===path.length-1?'active':''}">
    <b>${i===0?'🌿 第一代母株':'🌱 第 '+p.generation+' 代子代'}</b><br>
    ${p.name}<span style="color:#6b7280"> · ${p.method}</span>
  </div>`).join('<div style="text-align:center;color:#9ca3af">↓</div>');
}
function selectGenealogyPlant(id){
  const p=RARE_BREEDING_DATA.find(x=>x.id===id); if(!p)return;
  const detail=document.getElementById('genealogy-detail');
  const trace=document.getElementById('genealogy-trace');
  if(detail) detail.innerHTML=`<div style="font-size:13px;color:#6b7280">目前選取</div>
    <h3 style="margin:6px 0">${p.name}</h3>
    <div class="g-stat-grid">
      <div class="g-stat">品種<b>${p.species}</b></div>
      <div class="g-stat">世代<b>第 ${p.generation} 代</b></div>
      <div class="g-stat">繁殖方式<b>${p.method}</b></div>
      <div class="g-stat">珍稀等級<b>${'★'.repeat(p.rarity)}</b></div>
    </div>
    <div style="margin-top:12px;color:#4b5563">母株：${p.parent ? (RARE_BREEDING_DATA.find(x=>x.id===p.parent)?.name||p.parent) : '原始母株'}</div>`;
  if(trace) trace.innerHTML=`<h3 style="margin-top:0">🔎 血統追蹤</h3>
    <p style="color:#6b7280">點擊任一子代，可沿血統線反查最原始母株。</p>
    <div class="g-trace-list">${genealogyTrace(id)}</div>
    <div style="margin-top:14px;padding:12px;border-radius:12px;background:#f0fdf4;color:#166534">
      ✓ 此植株可追溯至第一代母株：<b>${RARE_BREEDING_DATA[0].name}</b>
    </div>`;
  const tree=document.getElementById('genealogy-tree');
  if(tree) tree.innerHTML=buildGenealogyTree(id);
}
function renderBreedingGenealogyPage(){
  return `<div class="genealogy-breeding">
    <div>
      <div style="font-size:13px;color:#6b7280">珍稀植物繁育管理</div>
      <h2 style="margin:4px 0 8px">🌿 家族族譜</h2>
      <p style="color:#6b7280;margin:0">管理鹿角蕨親本、側芽與分株，建立多世代繁育脈絡。</p>
    </div>
    <div class="genealogy-toolbar">
      <select style="padding:10px 12px;border:1px solid #d1d5db;border-radius:10px">
        <option>全部品種</option><option>二叉鹿角蕨</option><option>安哥拉鹿角蕨</option><option>皇冠鹿角蕨</option><option>巨獸鹿角蕨</option>
      </select>
      <select style="padding:10px 12px;border:1px solid #d1d5db;border-radius:10px">
        <option>全部世代</option><option>第一代</option><option>第二代</option><option>第三代</option><option>第四代</option>
      </select>
      <span style="padding:10px 12px;background:#f0fdf4;color:#166534;border-radius:10px">🌱 已建立 ${RARE_BREEDING_DATA.length} 株繁育關聯</span>
    </div>
    <div class="g-stat-grid">
      <div class="g-stat">原生種管理<b>18 種</b></div>
      <div class="g-stat">繁育植株<b>${RARE_BREEDING_DATA.length} 株</b></div>
      <div class="g-stat">目前世代<b>第 4 代</b></div>
      <div class="g-stat">可追溯母株<b>100%</b></div>
    </div>
    <div class="genealogy-tree-card">
      <h3 style="margin-top:0">🌳 繁育系譜樹狀圖</h3>
      <p style="color:#6b7280">點擊任意節點查看繁殖方式，並反查最原始母株。</p>
      <div id="genealogy-tree" class="genealogy-tree">${buildGenealogyTree()}</div>
    </div>
    <div id="genealogy-detail" class="genealogy-info-card"></div>
    <div id="genealogy-trace" class="genealogy-trace-card"></div>
  </div>`;
}
</script>

<script id="breeding-genealogy-v2-js">
const BGV2_PLANTS=[
 {id:"PL-001",name:"二叉鹿角蕨 #001",species:"二叉鹿角蕨",gen:1,method:"原始母株",parent:null,rarity:5,date:"2025/03/12"},
 {id:"PL-002",name:"二叉鹿角蕨 A-01",species:"二叉鹿角蕨",gen:2,method:"側芽繁殖",parent:"PL-001",rarity:4,date:"2025/08/20"},
 {id:"PL-003",name:"二叉鹿角蕨 A-02",species:"二叉鹿角蕨",gen:2,method:"側芽繁殖",parent:"PL-001",rarity:4,date:"2025/08/20"},
 {id:"PL-004",name:"二叉鹿角蕨 A-01-01",species:"二叉鹿角蕨",gen:3,method:"分株繁殖",parent:"PL-002",rarity:4,date:"2026/02/14"},
 {id:"PL-005",name:"二叉鹿角蕨 A-01-01-01",species:"二叉鹿角蕨",gen:4,method:"分株繁殖",parent:"PL-004",rarity:5,date:"2026/06/18"}
];
let BGV2_SELECTED="PL-005";
function bgv2Stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function bgv2Path(id){
 const map=Object.fromEntries(BGV2_PLANTS.map(p=>[p.id,p])), out=[]; let p=map[id];
 while(p){out.unshift(p);p=p.parent?map[p.parent]:null} return out;
}
function bgv2PlantCard(p){
 return `<div class="bgv2-plant ${p.id===BGV2_SELECTED?"selected":""}" onclick="BGV2_select('${p.id}')">
  <div class="bgv2-plant-top"><span class="bgv2-plant-name">🌿 ${p.name}</span><span class="bgv2-stars">${bgv2Stars(p.rarity)}</span></div>
  <div style="font-size:12px;color:#6b7280;margin-top:4px">第 ${p.gen} 代 · ${p.id}</div>
  <span class="bgv2-pill">${p.method}</span>
 </div>`;
}
function bgv2Timeline(id){
 const path=bgv2Path(id);
 return path.map((p,i)=>`<div class="bgv2-event">
  <div class="bgv2-event-date">${p.date}</div>
  <div class="bgv2-event-title">${i===0?"🌿 建立原始母株":p.method==="側芽繁殖"?"🌱 發現並建立側芽":"✂️ 完成分株並建立子代"}</div>
  <div class="bgv2-event-desc">${p.name} · 第 ${p.gen} 代 · ${p.method}</div>
 </div>`).join("");
}
function bgv2Trace(id){
 return bgv2Path(id).map((p,i)=>`<div class="bgv2-trace-item ${i===0||i===bgv2Path(id).length-1?"active":""}">
   <b>${i===0?"🌿 第一代母株":"🌱 第 "+p.gen+" 代"}</b>　${p.name}
 </div>`).join('<div style="text-align:center;color:#9ca3af">↓</div>');
}
function bgv2TreeNode(p){

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let pendingAddPlantPhoto = null;
let pendingAddPlantPhotoProcessing = false;

// 新增植物照片：先轉成可直接嵌入 HTML 的 Data URL，並縮小大照片，
// 避免使用 blob/object URL 導致換頁或重新開啟後圖片失效。
function previewAddPlantPhoto(e){
  const file = e.target.files && e.target.files[0];
  const preview = document.getElementById("ap-photo-preview");
  pendingAddPlantPhoto = null;
  pendingAddPlantPhotoProcessing = false;
  if(!file){
    if(preview) preview.innerHTML = `<span class="text-xs text-stone-400">尚未選擇圖片</span>`;
    return;
  }
  if(!file.type.startsWith("image/")){
    if(preview) preview.innerHTML = `<span class="text-xs text-red-500">請選擇圖片檔案</span>`;
    return;
  }

  pendingAddPlantPhotoProcessing = true;
  if(preview) preview.innerHTML = `<span class="text-xs text-stone-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i>照片處理中…</span>`;

  const reader = new FileReader();
  reader.onerror = function(){
    pendingAddPlantPhotoProcessing = false;
    if(preview) preview.innerHTML = `<span class="text-xs text-red-500">照片讀取失敗，請重新選擇</span>`;
  };
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxSide = 1400;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
      const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      // JPEG 大幅降低手機照片的容量，讓資料能穩定放在植物資料裡。
      pendingAddPlantPhoto = canvas.toDataURL("image/jpeg", 0.82);
      pendingAddPlantPhotoProcessing = false;
      if(preview) preview.innerHTML = `<img src="${pendingAddPlantPhoto}" class="w-full h-full object-cover rounded-xl" alt="新增植物照片預覽">`;
    };
    img.onerror = function(){
      pendingAddPlantPhotoProcessing = false;
      if(preview) preview.innerHTML = `<span class="text-xs text-red-500">照片格式無法讀取，請重新選擇</span>`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

   使用 localStorage，不改變原有操作流程。

const PLANT_MANAGER_STORAGE_KEY = "plant_manager_state_v1";
function saveState(){
  try{
    const snapshot = JSON.parse(JSON.stringify(state));
    // UI 暫態狀態不需要保存，避免重新開啟時直接進入某株詳情或彈窗。
    snapshot.selectedPlantId = null;
    snapshot.modal = null;
    snapshot.voice = { text:"", listening:false, parsed:null, queryText:"", queryResult:null };
    localStorage.setItem(PLANT_MANAGER_STORAGE_KEY, JSON.stringify(snapshot));
  }catch(err){
    console.warn("植物資料保存失敗", err);
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(PLANT_MANAGER_STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !Array.isArray(saved.plants)) return false;
    state = Object.assign(state, saved);
    state.plants = Array.isArray(state.plants) ? state.plants : [];
    state.plants.forEach(p=>{
      p.photos = Array.isArray(p.photos) ? p.photos : [];
      p.moveHistory = Array.isArray(p.moveHistory) ? p.moveHistory : [];
    });
    return true;
  }catch(err){
    console.warn("植物資料讀取失敗，使用原始資料", err);
    return false;
  }
}

function alivePlants(){ return state.plants.filter(p=>p.status==="存活"); }
function deadPlants(){ return state.plants.filter(p=>p.status==="已死亡"); }
function survivalRate(){
  return state.plants.length ? Math.round(alivePlants().length/state.plants.length*100) : 0;
}
function binCNRatio(bin){
  if(!bin.inputs.length) return null;
  const totalWeight = bin.inputs.reduce((s,i)=>s+i.weight,0);
  const weighted = bin.inputs.reduce((s,i)=>s+i.weight*i.ratio,0);
  return Math.round(weighted/totalWeight);
}
function marketStats(){
  return state.markets.map(m=>{
    const purchased = state.plants.filter(p=>p.source===m.id);
    const alive = purchased.filter(p=>p.status==="存活");
    return {...m, total:purchased.length, alive:alive.length,
      rate: purchased.length ? Math.round(alive.length/purchased.length*100) : 0};
  });
}
// 這裡新增族譜邏輯：以 parentId（無性）優先，其次 motherId（有性/交配種）決定血緣主線
function primaryParentId(p){ return p.parentId || p.motherId || null; }
// 家族族譜只管理鹿角蕨；非鹿角蕨維持一般植物資料，不加入族譜。
// 鹿角蕨即使沒有設定母株／父株，也會自動以「第 1 代母株」進入族譜。
function isGenealogyPlant(p){ return !!p && p.isStaghorn === true; }
function familyRoots(){ return state.plants.filter(p=>isGenealogyPlant(p) && !primaryParentId(p)); }
function familyChildren(id){ return state.plants.filter(p=>isGenealogyPlant(p) && primaryParentId(p)===id); }

function plantCurrentPotSize(p){
  // 以這一株自己的最新盆器歷程為準，避免目前盆器與歷程最後一筆對不起來。
  const history = Array.isArray(p.moveHistory) ? p.moveHistory : [];
  const latest = history.length ? history[history.length - 1] : null;
  return latest && latest.potSize != null ? latest.potSize : p.potSize;
}
function plantPotDisplay(p){
  // 每一筆植物資料只顯示自己的目前盆器；子代是獨立植物資料，
  // 不把子代盆器合併到母株，避免「盆器大小」與「盆器與場地歷程」對不起來。
  const size = plantCurrentPotSize(p);
  return size ? `${size} 吋盆` : "尚未設定";
}
// 這裡新增族譜邏輯：植株的狀態燈號（綠/灰/紅）與文字說明
function plantStatusMeta(p){
  if(p.status==="存活"){
    return { dot:"bg-emerald-500", ring:"ring-emerald-100", label:`存活 · ${plantCurrentPotSize(p)}吋盆`, textCls:"text-emerald-700" };
  } else if(p.status==="已出售"){
    return { dot:"bg-stone-400", ring:"ring-stone-100", label:`已出售給 ${esc(p.soldTo||"未填寫")}`, textCls:"text-stone-500" };
  }
  return { dot:"bg-red-500", ring:"ring-red-100", label:`死因：${esc(p.deathCause||"未填寫")}`, textCls:"text-red-600 font-bold" };
}

function addPlant(data){
  // 這裡新增族譜邏輯：新增植物時可選擇 parentId（分株／側芽，無性）或
  // motherId + fatherId（交配種，有性）。若都沒有指定，視為外購/獨立植株（第 1 代）。
  const id = nextPlantId();
  const parentId = data.parentId || null;
  const motherId = data.motherId || null;
  const fatherId = data.fatherId || null;
  const linkedParent = parentId ? state.plants.find(p=>p.id===parentId)
                     : motherId ? state.plants.find(p=>p.id===motherId)
                     : null;
  const generation = linkedParent ? (linkedParent.generation||1)+1 : 1;
  // 鹿角蕨新增時即自動成為族譜中的根節點；若指定母株／父株，則自動接到對應血統。
  const normalizedGeneration = data.isStaghorn ? generation : 1;
  const newPlant = {
    id, name:data.name, species:data.species||data.name, isStaghorn:!!data.isStaghorn,
    source:data.source, price:Number(data.price)||0, acquireDate:data.acquireDate,
    status:"存活", location:data.location, potSize:Number(data.potSize)||4,
    parentId, motherId, fatherId, generation:normalizedGeneration,
    propagationMethod: data.propagationMethod || (parentId||motherId ? "分株" : "花市購入"),
    photos: data.photos || [],
    moveHistory:[{location:data.location, potSize:Number(data.potSize)||4, date:data.acquireDate}]
  };
  state.plants.push(newPlant);

  // 「新手園丁」代表使用者第一次透過系統新增植物。
  // 不再用 state.plants.length===0 判斷，避免 seedPlants() 的示範資料讓成就永遠無法解鎖。
  if(!state.hasAddedFirstPlant){
    state.hasAddedFirstPlant = true;
    unlockBadge("b1");
  }

  if(state.plants.length>=10) unlockBadge("b5");
  if(motherId || fatherId) unlockBadge("b4");
  gainXp(10);
  if(Array.isArray(newPlant.photos) && newPlant.photos.length) gainXp(10);
  showToast(`已新增植物 ${id}`, "fa-seedling");
  closeModal();
  render();
}

// 天氣資料：優先查 Open-Meteo 歷史氣象；查不到時才使用明確標示的備援估算。
async function fetchDeathWeather(plant, deathDate){
  const fallback = () => ({
    temp: Number((Math.random()*12+22).toFixed(1)),
    humidity: Math.round(Math.random()*25+55),
    weatherCode: null,
    weatherText: "備援估算（未取得歷史 API 資料）",
    location: plant.location || "未設定地點",
    source: "fallback",
    date: deathDate
  });

  if(state.apiOffline) return fallback();

  try{
    let latitude = null, longitude = null, resolvedLocation = plant.location || "";

    // 若植物地點本身是城市／地區名稱，直接用 Open-Meteo 地理編碼查詢。
    if(resolvedLocation){
      const geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(resolvedLocation) + "&count=1&language=zh&format=json";
      const geoRes = await fetch(geoUrl);
      if(geoRes.ok){
        const geo = await geoRes.json();
        const hit = geo?.results?.[0];
        if(hit){
          latitude = Number(hit.latitude);
          longitude = Number(hit.longitude);
          resolvedLocation = [hit.name, hit.admin1].filter(Boolean).join("，");
        }
      }
    }

    // 植物地點常是「陽台／後院溫室」這類室內標籤，無法地理編碼時，
    // 嘗試使用瀏覽器目前位置；若使用者拒絕，再走備援估算。
    if((latitude==null || longitude==null) && navigator.geolocation){
      const pos = await new Promise(resolve=>navigator.geolocation.getCurrentPosition(resolve, ()=>resolve(null), {enableHighAccuracy:false, timeout:2500, maximumAge:86400000}));
      if(pos){
        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;
        resolvedLocation = "裝置所在位置附近";
      }
    }

    if(latitude==null || longitude==null) return fallback();

    const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + latitude + "&longitude=" + longitude + "&start_date=" + encodeURIComponent(deathDate) + "&end_date=" + encodeURIComponent(deathDate) + "&hourly=temperature_2m,relative_humidity_2m,weather_code&timezone=auto";
    const res = await fetch(url);
    if(!res.ok) throw new Error("weather api " + res.status);
    const data = await res.json();
    const temps = (data?.hourly?.temperature_2m || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    const hums = (data?.hourly?.relative_humidity_2m || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    const codes = (data?.hourly?.weather_code || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    if(!temps.length) throw new Error("no weather data");

    const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
    const code = codes.length ? Math.round(codes.reduce((a,b)=>a+b,0)/codes.length) : null;
    const weatherNames = {
      0:"晴朗",1:"大致晴朗",2:"局部多雲",3:"陰天",45:"霧",48:"霧凇",
      51:"小毛雨",53:"毛雨",55:"大毛雨",61:"小雨",63:"中雨",65:"大雨",
      71:"小雪",73:"中雪",75:"大雪",80:"小陣雨",81:"陣雨",82:"大陣雨",
      95:"雷雨",96:"雷雨伴冰雹",99:"強雷雨伴冰雹"
    };
    return {
      temp: Number(avg(temps).toFixed(1)),
      humidity: hums.length ? Math.round(avg(hums)) : null,
      weatherCode: code,
      weatherText: weatherNames[code] || "歷史氣象",
      location: resolvedLocation,
      latitude: Number(latitude.toFixed(5)),
      longitude: Number(longitude.toFixed(5)),
      source: "Open-Meteo",
      date: deathDate
    };
  }catch(err){
    console.warn("死亡日期氣象查詢失敗，改用備援資料", err);
    return fallback();
  }
}

/* =========================================================================
   AI 語音
========================================================================= */
function parseVoiceCommand(text){
  const amountMatch = text.match(/(\d+)\s*元/);
  const amount = amountMatch ? Number(amountMatch[1]) : null;
  let action = "未知";
  if(/買|購入/.test(text)) action = "購入";
  else if(/賣|售出/.test(text)) action = "售出";
  else if(/澆水/.test(text)) action = "澆水";

  const knownNames = [...new Set(state.plants.map(p=>p.species))];
  const matchedSpecies = knownNames.find(n=>text.includes(n));

  if(matchedSpecies){
    const candidates = state.plants.filter(p=>p.species===matchedSpecies && p.status==="存活");
    const hints = { "窗台":"窗邊", "門口":"門口", "角落":"角落" };
    const hintKey = Object.keys(hints).find(h=>text.includes(h));
    if(candidates.length>1 && !hintKey){
      return { ambiguous:true, species:matchedSpecies, candidates, action, amount, rawText:text };
    }
    const target = hintKey ? (candidates.find(c=>c.location.includes(hints[hintKey])) || candidates[0]) : candidates[0];
    return { ambiguous:false, species:matchedSpecies, target, action, amount, rawText:text };
  }
  return { ambiguous:false, species:null, target:null, action, amount, rawText:text };
}
function confirmVoiceEntry(){
  const parsed = state.voice.parsed;
  if(parsed.action==="購入" && parsed.amount){
    addPlant({ name:parsed.species||"語音建檔植物", species:parsed.species,
      source: state.markets[0]?.id, price:parsed.amount, acquireDate: todayStr(),
      location: LOCATIONS[0], potSize:4 });
  }
  unlockBadge("b6");
  gainXp(15);
  showToast("語音資料已確認寫入資料庫", "fa-check");
  state.voice = { text:"", listening:false, parsed:null, queryText: state.voice.queryText, queryResult: state.voice.queryResult };
  render();
}

function exportCSV(){
  const rows = [["類型","項目","金額","日期"]];
  state.plants.forEach(p=>rows.push(["購入", p.name, p.price, p.acquireDate]));
  state.sales.filter(s=>!s.voided).forEach(s=>rows.push(["銷售", s.target, s.salePrice-s.cost, s.date]));
  const csv = rows.map(r=>r.join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "溫室報表.csv"; a.click();
  URL.revokeObjectURL(url);
  showToast("CSV 已匯出下載", "fa-download");
}
function expenseBreakdown(){
  const plantCost = state.plants.reduce((s,p)=>s+(p.price||0),0);
  const materialCost = state.materials.length*50;
  const compostVal = state.compostBins.reduce((s,b)=>s+b.inputs.length*10,0);
  return [
    { name:"植物購入", value: plantCost || 1 },
    { name:"資材耗材", value: materialCost },
    { name:"堆肥投入", value: compostVal || 1 }
  ];
}

function handlePlantListPhotoUpload(e, plantId){
  const file = e.target.files && e.target.files[0];
  if(!file || !file.type.startsWith("image/")) { showToast("請選擇圖片檔案", "fa-image"); return; }
  const plant = state.plants.find(p=>p.id===plantId);
  if(!plant) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxSide=1400, scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
      const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
      const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      plant.photos=Array.isArray(plant.photos)?plant.photos:[];
      plant.photos.push({id:uid("ph"),url:canvas.toDataURL("image/jpeg",0.82),date:todayStr(),eventType:"植物總表紀錄"});
      gainXp(10); evaluateProgressBadges(); saveState();
      showToast(`已為 ${plant.name} 新增照片紀錄`, "fa-camera");
      renderPlants();
    };
    img.onerror=()=>showToast("照片無法讀取，請重新選擇", "fa-triangle-exclamation");
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value="";
}

  const navList = document.getElementById("nav-list");
  navList.innerHTML = NAV.map(n => `
    <button data-action="switch-tab" data-tab="${n.id}"
      class="w-full flex items-center gap-3 px-4 py-2.5 rounded-2xl transition-all duration-300 hover:scale-[1.03] active:scale-95 text-sm font-medium text-left ${
        state.tab===n.id ? "bg-gradient-to-r from-amber-400 to-emerald-500 text-white shadow-lg" : "text-emerald-50/80 hover:bg-emerald-800/60"}">
      <span class="w-5 text-center shrink-0" aria-hidden="true">${n.icon}</span>
      <span class="truncate">${n.label}</span>
    </button>`).join("");
  renderSidebarMeta();

  const banner = document.getElementById("offline-banner");
  banner.className = state.apiOffline
    ? "mb-4 bg-orange-100 border border-orange-300 text-orange-800 text-sm rounded-2xl px-4 py-3 flex items-center gap-2"
    : "hidden";

  const apiBtn = document.getElementById("api-toggle");
  const apiLabel = document.getElementById("api-toggle-label");
  const apiIcon = document.getElementById("api-toggle-icon");
  if(state.apiOffline){
    apiBtn.className = "w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs transition-all duration-300 hover:scale-105 active:scale-95 bg-orange-800/70 text-orange-100";
    apiIcon.textContent = "🔌";
    apiLabel.textContent = "模擬外部 API 斷線中";
  } else {
    apiBtn.className = "w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs transition-all duration-300 hover:scale-105 active:scale-95 bg-emerald-900/60 text-emerald-100";
    apiIcon.textContent = "📶";
    apiLabel.textContent = "外部 API 連線正常";
  }
}
function renderSidebarMeta(){
  const level = Math.floor(state.xp/100)+1;
  const xpInLevel = state.xp%100;
  document.getElementById("level-label").textContent = `Lv.${level} 園丁`;
  document.getElementById("xp-label").textContent = `${xpInLevel}/100`;
  document.getElementById("xp-bar").style.width = xpInLevel+"%";
}

/* =========================================================================
   植株關係圖 — 這裡新增族譜邏輯：改版為「標註照片＋近期紀錄＋詳情面板」樣式
   資料模型：parentId = 無性繁殖（分株／側芽）；motherId + fatherId = 有性繁殖（交配種）
   每一株「有子代」的植株會顯示一張標註照片卡（母株照片上以色點＋標籤標出各個子代），
   下方列出近期紀錄時間軸；點擊任一子代會開啟詳情面板，說明這是什麼繁殖關係並給照顧建議。
========================================================================= */
// 這裡新增族譜邏輯：三種血緣關係的顏色／圖示／說明文字
const FAMILY_CATEGORY_META = {
  "側芽": { color:"blue",   icon:"fa-seedling", desc:"從母株旁邊長出的小芽，未來長大即可分離培育成獨立植株。" },
  "分株": { color:"purple", icon:"fa-hand-scissors", desc:"植株長大後將根莖分切開來，直接形成獨立的新植株。" },
  "交配種": { color:"amber",  icon:"fa-dna", desc:"由母株與父株進行有性繁殖（孢子交配）所培育出的新品種。" }
};
const FAMILY_COLOR_CLASSES = {
  blue:   { dot:"bg-blue-500",   pill:"bg-blue-500",   soft:"bg-blue-100 text-blue-700" },
  purple: { dot:"bg-purple-500", pill:"bg-purple-500", soft:"bg-purple-100 text-purple-700" },
  amber:  { dot:"bg-amber-500",  pill:"bg-amber-500",  soft:"bg-amber-100 text-amber-700" }
};
// 這裡新增族譜邏輯：標註色點在照片上的預設位置（依序輪流使用，避免重疊）
const FAMILY_PIN_POSITIONS = [
  {top:"12%", left:"66%"}, {top:"55%", left:"12%"}, {top:"70%", left:"72%"},
  {top:"30%", left:"20%"}, {top:"78%", left:"38%"}, {top:"15%", left:"38%"}
];
function plantThumbUrl(p){
  if(p.photos && p.photos.length){
    const sorted = [...p.photos].sort((a,b)=>a.date<b.date?1:-1);
    return sorted[0].url;
  }
  return null;
}
function statusPillClasses(status){
  return status==="存活" ? "bg-emerald-100 text-emerald-700"
       : status==="已出售" ? "bg-stone-200 text-stone-500"
       : "bg-red-100 text-red-600";
}
// 這裡新增族譜邏輯：判斷一株植物相對於母株的繁殖關係類別
function plantFamilyCategory(plant){
  if(plant.motherId) return "交配種";
  if(plant.parentId) return plant.propagationMethod==="分株" ? "分株" : "側芽";
  return null;
}
// 這裡新增族譜邏輯：為每個子代自動產生一句簡短描述
function familyChildDesc(plant, category){
  if(category==="交配種") return `與父株進行有性繁殖後培育出的新品種，目前${plant.status}。`;
  if(category==="分株") return `由母株分切根莖形成的獨立植株，目前${plant.status}。`;
  return `從母株旁長出的側芽，目前${plant.status}${plant.status==="存活"?`（${plant.potSize}吋盆）`:""}。`;
}
// 這裡新增族譜邏輯：依植株種類給出簡短照顧建議
function familyCareTip(plant){
  if(plant.isStaghorn){
    return "維持通風與適度日照，孢子葉請勿摘除；側芽長至約 3 吋大小、根系穩定後再分離較容易存活。";
  }
  return "分株或側芽移植後前 2 週應放置於遮陰處緩苗，並維持土壤微濕，待新根長出後再恢復正常光照與澆水頻率。";
}
// 這裡新增族譜邏輯：依序找出所有「擁有子代」的植株（樹狀結構的內部節點），依血緣順序排列
function collectFamilyCards(){
  const result = [];
  function walk(node){
    if(!isGenealogyPlant(node)) return;
    if(familyChildren(node.id).length){
      result.push(node);
      familyChildren(node.id).forEach(walk);
    }
  }
  familyRoots().forEach(walk);
  return result;
}

function backToGenealogyRoots(){
  state.genealogyFocusId = null;

function bgFamilyPath(id){
  const path=[];
  let current=state.plants.find(p=>p.id===id);
  while(current){
    path.unshift(current);
    const parent=primaryParentId(current);
    current=parent ? state.plants.find(p=>p.id===parent) : null;
  }
  return path.map((p,i)=>`
    <button onclick="focusGenealogy('${p.id}')"
      class="shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-white border ${p.id===id?'border-emerald-400':'border-stone-100'} hover:border-emerald-300">
      <i class="fa-solid fa-seedling text-emerald-600"></i>
      <span class="text-xs font-medium text-stone-700">${esc(p.name)}</span>
      <span class="text-[9px] text-stone-400">第${p.generation||1}代</span>
    </button>
    ${i<path.length-1?'<i class="fa-solid fa-chevron-right text-stone-300 shrink-0"></i>':''}
  `).join("");
}

/* =========================================================================
   報表匯出
========================================================================= */
function renderReports(){
  const salesTotal = state.sales.filter(x=>!x.voided).reduce((s,x)=>s+(Number(x.salePrice)||0),0);
  const plantCost = state.plants.reduce((s,x)=>s+(Number(x.price)||0),0);
  const compostCost = state.compostBins.reduce((s,x)=>
    s + (Array.isArray(x.inputs) ? x.inputs.reduce((a,i)=>a+(Number(i.cost)||0),0) : 0),0);

  // 耗材：優先從耗材資料的成本欄位統計；若目前資料沒有成本，則顯示 0
  const consumableCost = (state.materials || []).reduce((s,x)=>
    s + (Number(x.cost)||Number(x.price)||0),0);

  // 盆器：從植物目前盆器/移動歷程中抓取可用價格欄位
  const potCost = state.plants.reduce((s,x)=>{
    const history = Array.isArray(x.moveHistory) ? x.moveHistory : [];
    return s + history.reduce((a,h)=>a+(Number(h.cost)||Number(h.price)||0),0);
  },0);

  const otherCost = Math.max(0, (state.expenses || []).reduce((s,x)=>s+(Number(x.amount)||0),0));

  const categories = [
    {name:"植物購買", value:plantCost, icon:"fa-seedling"},
    {name:"耗材", value:consumableCost, icon:"fa-toolbox"},
    {name:"盆器", value:potCost, icon:"fa-box"},
    {name:"堆肥", value:compostCost, icon:"fa-recycle"},
    {name:"其他", value:otherCost, icon:"fa-ellipsis"}
  ];

  const totalCost = categories.reduce((s,x)=>s+x.value,0);
  const chartColors = ["#059669","#0ea5e9","#f59e0b","#8b5cf6","#78716c"];

  // SVG 圓餅圖：不依賴第三方圖表套件
  let currentAngle = -90;
  const slices = categories.map((c,i)=>{
    const pct = totalCost ? c.value/totalCost : 0;
    const startAngle = currentAngle;
    const endAngle = currentAngle + pct*360;
    currentAngle = endAngle;

    const polar = (angle, radius) => {
      const rad = angle*Math.PI/180;
      return [100 + radius*Math.cos(rad), 100 + radius*Math.sin(rad)];
    };

    let path = "";
    if(pct >= 0.9999){
      path = `<circle cx="100" cy="100" r="78" fill="${chartColors[i]}"></circle>`;
    } else if(pct > 0){
      const [sx,sy] = polar(startAngle,78);
      const [ex,ey] = polar(endAngle,78);
      const large = endAngle-startAngle > 180 ? 1 : 0;
      path = `<path d="M 100 100 L ${sx} ${sy} A 78 78 0 ${large} 1 ${ex} ${ey} Z" fill="${chartColors[i]}"></path>`;
    }
    return {...c,pct,path,color:chartColors[i]};
  });

  const chart = totalCost
    ? slices.map(s=>s.path).join("")
    : `<circle cx="100" cy="100" r="78" fill="#e7e5e4"></circle>`;

  const legend = slices.map(s=>{
    const percent = totalCost ? Math.round(s.pct*100) : 0;
    return `
      <button onclick="showExpenseCategory('${s.name}')"
        class="w-full flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 hover:bg-stone-50 transition text-left">
        <span class="flex items-center gap-2 min-w-0">
          <span class="w-3 h-3 rounded-full shrink-0" style="background:${s.color}"></span>
          <i class="fa-solid ${s.icon} text-stone-400 w-4"></i>
          <span class="text-xs text-stone-700 truncate">${s.name}</span>
        </span>
        <span class="text-right shrink-0">
          <b class="text-xs text-stone-700">$${s.value.toLocaleString()}</b>
          <span class="text-[10px] text-stone-400 ml-1">${percent}%</span>
        </span>
      </button>`;
  }).join("");

  const top = [...slices].sort((a,b)=>b.value-a.value)[0];
  const insight = top && top.value > 0
    ? `本期「${top.name}」支出最高，佔總花費 ${Math.round(top.pct*100)}%。`
    : "目前尚無花費資料，新增植物、耗材、盆器或堆肥紀錄後會自動統計。";

  document.getElementById("main-content").innerHTML = `
    <div class="space-y-5">
      <div>
        <p class="text-[11px] text-emerald-700 font-medium">數據管理</p>
        <h1 class="font-serif-cjk text-2xl sm:text-3xl font-bold text-stone-800 mt-1">報表與分析</h1>
        <p class="text-sm text-stone-500 mt-1">快速掌握植物經營的花費與收入。</p>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white rounded-2xl border border-stone-100 p-4 shadow-sm">
          <p class="text-xs text-stone-400">植物總數</p>
          <p class="text-2xl font-bold text-stone-800 mt-1">${state.plants.length}</p>
          <p class="text-[10px] text-stone-400 mt-1">目前紀錄</p>
        </div>
        <div class="bg-white rounded-2xl border border-stone-100 p-4 shadow-sm">
          <p class="text-xs text-stone-400">總花費</p>
          <p class="text-2xl font-bold text-emerald-700 mt-1">$${totalCost.toLocaleString()}</p>
          <p class="text-[10px] text-stone-400 mt-1">目前紀錄</p>
        </div>
        <div class="bg-white rounded-2xl border border-stone-100 p-4 shadow-sm">
          <p class="text-xs text-stone-400">銷售收入</p>
          <p class="text-2xl font-bold text-amber-600 mt-1">$${salesTotal.toLocaleString()}</p>
          <p class="text-[10px] text-stone-400 mt-1">目前紀錄</p>
        </div>
        <div class="bg-white rounded-2xl border border-stone-100 p-4 shadow-sm">
          <p class="text-xs text-stone-400">淨額</p>
          <p class="text-2xl font-bold ${salesTotal-totalCost>=0?'text-emerald-700':'text-red-600'} mt-1">$${(salesTotal-totalCost).toLocaleString()}</p>
          <p class="text-[10px] text-stone-400 mt-1">收入 − 花費</p>
        </div>
      </div>

      <section class="bg-[#fffdf8] rounded-[1.8rem] border border-white shadow-sm p-4 sm:p-6">
        <div class="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h2 class="font-serif-cjk text-lg font-bold text-stone-800 flex items-center gap-2">
              <span class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 grid place-items-center">
                <i class="fa-solid fa-chart-pie"></i>
              </span>
              花費結構
            </h2>
            <p class="text-xs text-stone-400 mt-1">點擊分類可以查看該類別的花費內容。</p>
          </div>
          <span class="text-xs px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700">
            總花費 $${totalCost.toLocaleString()}
          </span>
        </div>

        <div class="grid lg:grid-cols-[1fr_1fr] gap-6 items-center mt-5">
          <div class="relative mx-auto w-64 h-64">
            <svg viewBox="0 0 200 200" class="w-full h-full -rotate-0">
              ${chart}
              <circle cx="100" cy="100" r="46" fill="#fffdf8"></circle>
            </svg>
            <div class="absolute inset-0 grid place-items-center pointer-events-none">
              <div class="text-center">
                <p class="text-[10px] text-stone-400">總花費</p>
                <p class="text-2xl font-bold text-stone-800">$${totalCost.toLocaleString()}</p>
                <p class="text-[10px] text-stone-400">目前紀錄</p>
              </div>
            </div>
          </div>

          <div>
            <div class="divide-y divide-stone-100">
              ${legend}
            </div>
            <div class="mt-4 rounded-2xl bg-emerald-50/70 border border-emerald-100 p-3.5">
              <p class="text-xs text-emerald-800">
                <i class="fa-solid fa-lightbulb mr-1"></i>${insight}
              </p>
            </div>
          </div>
        </div>
      </section>

      <section id="expense-category-detail" class="bg-white rounded-[1.8rem] border border-stone-100 shadow-sm p-4 sm:p-6">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 class="font-serif-cjk text-lg font-bold text-stone-800">📋 花費明細</h2>
            <p class="text-xs text-stone-400 mt-1">選擇上方分類後，這裡會顯示對應的紀錄。</p>
          </div>
          <span class="text-[10px] text-stone-400">可點擊圓餅圖分類</span>
        </div>
        <div class="mt-4 rounded-2xl bg-stone-50 p-6 text-center text-xs text-stone-400">
          點擊「植物購買、耗材、盆器、堆肥或其他」查看明細
        </div>
      </section>
    </div>`;
}

function showExpenseCategory(category){
  const box = document.getElementById("expense-category-detail");
  if(!box) return;

  let rows = [];

  if(category==="植物購買"){
    rows = state.plants.map(p=>({
      title:p.name,
      sub:`${p.species} · ${p.acquireDate || "－"}`,
      amount:Number(p.price)||0,
      icon:"fa-seedling"
    })).filter(x=>x.amount>0);
  }else if(category==="堆肥"){
    state.compostBins.forEach(bin=>{
      (bin.inputs||[]).forEach(i=>{
        const amount=Number(i.cost)||0;
        if(amount>0) rows.push({title:i.material||"堆肥材料",sub:`${bin.name||"堆肥箱"} · ${i.date||"－"}`,amount,icon:"fa-recycle"});
      });
    });
  }else if(category==="耗材"){
    rows=(state.materials||[]).map(m=>({
      title:m.name||m.material||"耗材",
      sub:m.date||m.type||"耗材紀錄",
      amount:Number(m.cost)||Number(m.price)||0,
      icon:"fa-toolbox"
    })).filter(x=>x.amount>0);
  }else if(category==="盆器"){
    state.plants.forEach(p=>{
      (p.moveHistory||[]).forEach(h=>{
        const amount=Number(h.cost)||Number(h.price)||0;
        if(amount>0) rows.push({title:`${p.name} · ${h.potSize||"－"}吋盆`,sub:h.date||"盆器紀錄",amount,icon:"fa-box"});
      });
    });
  }else if(category==="其他"){
    rows=(state.expenses||[]).map(e=>({
      title:e.name||e.title||"其他支出",
      sub:e.date||"其他紀錄",
      amount:Number(e.amount)||0,
      icon:"fa-ellipsis"
    })).filter(x=>x.amount>0);
  }

  const total=rows.reduce((s,x)=>s+x.amount,0);
  box.innerHTML=`
    <div class="flex items-center justify-between gap-3">
      <div>
        <h2 class="font-serif-cjk text-lg font-bold text-stone-800">📋 ${category}明細</h2>
        <p class="text-xs text-stone-400 mt-1">共 ${rows.length} 筆 · 合計 $${total.toLocaleString()}</p>
      </div>
      <button onclick="renderReports()" class="text-xs text-stone-400 hover:text-emerald-700">清除篩選</button>
    </div>
    <div class="mt-4">
      ${rows.length ? rows.map(r=>`
        <div class="flex items-center justify-between gap-3 py-3 border-b border-stone-100 last:border-0">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 grid place-items-center shrink-0">
              <i class="fa-solid ${r.icon}"></i>
            </span>
            <div class="min-w-0">
              <p class="text-sm text-stone-700 truncate">${esc(r.title)}</p>
              <p class="text-[10px] text-stone-400 truncate">${esc(String(r.sub))}</p>
            </div>
          </div>
          <b class="text-sm text-stone-700 shrink-0">$${r.amount.toLocaleString()}</b>
        </div>`).join("")
      : `<div class="rounded-2xl bg-stone-50 p-6 text-center text-xs text-stone-400">目前沒有可顯示的${category}花費紀錄。</div>`}
    </div>`;
}

function renderMain(){
  if(state.tab==="dashboard") renderDashboard();
  else if(state.tab==="plants") renderPlants();
  else if(state.tab==="genealogy") renderGenealogy();
  else if(state.tab==="market") renderMarket();
  else if(state.tab==="materials") renderMaterials();
  else if(state.tab==="sales") renderSales();
  else if(state.tab==="voice") renderVoice();
  else if(state.tab==="reports") renderReports();
}
function render(){ evaluateProgressBadges(); renderSidebar(); renderMain(); saveState(); }

/* =========================================================================
   小型 UI 輔助（modal 內部欄位切換）
========================================================================= */
function toggleStaghornField(){
  const isStaghorn = document.getElementById("ap-staghorn").value === "y";
  const wrap = document.getElementById("ap-species-wrap");
  if(isStaghorn){
    wrap.innerHTML = `<label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">原生種品種（18 種）</span>
      <select id="ap-species" class="w-full px-3 py-2 rounded-xl border border-stone-200 bg-white/70 text-sm text-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <option value="">請選擇</option>${NATIVE_STAGHORN_SPECIES.map(s=>`<option value="${s}">${s}</option>`).join("")}
      </select></label>`;
  } else {
    wrap.innerHTML = `<label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">品種</span>
      <input id="ap-species" class="w-full px-3 py-2 rounded-xl border border-stone-200 bg-white/70 text-sm text-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-400" placeholder="例如：龜背芋" /></label>`;
  }
}
function toggleSplitField(){
  const reason = document.getElementById("mv-reason").value;
  document.getElementById("mv-split-wrap").classList.toggle("hidden", reason!=="分株");
}
// 這裡新增族譜邏輯：依繁殖方式切換「新增植物」表單中的血緣欄位（parentId 或 motherId+fatherId）
function toggleLineageFields(){
  const method = document.getElementById("ap-propagation").value;
  const wrap = document.getElementById("ap-lineage-wrap");
  const inputCls = "w-full px-3 py-2 rounded-xl border border-stone-200 bg-white/70 text-sm text-stone-700 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all duration-300";
  const plantOptions = `<option value="">（無）</option>` + state.plants.map(p=>`<option value="${p.id}">${esc(p.id)} · ${esc(p.name)}</option>`).join('');
  if(method === "交配種"){
    wrap.classList.remove("hidden");
    wrap.innerHTML = `
      <label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">母株（Mother）</span>
        <select id="ap-mother" class="${inputCls}">${plantOptions}</select></label>
      <label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">父株（Father）</span>
        <select id="ap-father" class="${inputCls}">${plantOptions}</select></label>`;
  } else if(method === "分株" || method === "側芽"){
    wrap.classList.remove("hidden");
    wrap.innerHTML = `
      <label class="block sm:col-span-2"><span class="text-xs font-medium text-stone-500 mb-1 block">來源母株（無性繁殖）</span>
        <select id="ap-parent" class="${inputCls}">${plantOptions}</select></label>`;
  } else {
    wrap.classList.add("hidden");
    wrap.innerHTML = "";
  }
}

function openMobileNav(){
  document.getElementById("sidebar").classList.add("sidebar-open");
  document.getElementById("mobile-nav-backdrop").classList.remove("hidden");
}
function closeMobileNav(){
  document.getElementById("sidebar").classList.remove("sidebar-open");
  document.getElementById("mobile-nav-backdrop").classList.add("hidden");
}
document.getElementById("mobile-nav-toggle").addEventListener("click", openMobileNav);
document.getElementById("mobile-nav-close").addEventListener("click", closeMobileNav);

window.addEventListener("resize", function(){
  if(window.innerWidth >= 768) closeMobileNav();
});

/* =========================================================================
   事件代理（點擊）
========================================================================= */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="switch-tab"){ state.tab = el.dataset.tab; render(); closeMobileNav(); }
  else if(action==="close-modal"){ closeModal(); }
  else if(action==="select-plant"){ state.selectedPlantId = state.selectedPlantId===el.dataset.id ? null : el.dataset.id; renderPlants(); }
  else if(action==="select-plant-from-map"){ state.selectedPlantId = el.dataset.id; state.tab="plants"; render(); closeMobileNav(); }
  else if(action==="open-add-plant"){ openModal("addPlant", {}); }
  else if(action==="submit-add-plant"){
    const name = document.getElementById("ap-name").value.trim();
    if(!name) return;
    if(pendingAddPlantPhotoProcessing){
      showToast("照片還在處理中，請稍候", "fa-image");
      return;
    }
    // 這裡新增族譜邏輯：讀取繁殖方式與血緣欄位一併寫入
    addPlant({
      name,
      species: document.getElementById("ap-species").value,
      isStaghorn: document.getElementById("ap-staghorn").value==="y",
      source: document.getElementById("ap-source").value,
      price: document.getElementById("ap-price").value,
      acquireDate: document.getElementById("ap-date").value,
      location: document.getElementById("ap-location").value,
      potSize: document.getElementById("ap-pot").value,
      photos: pendingAddPlantPhoto ? [{id:uid("ph"), url:pendingAddPlantPhoto, date:todayStr(), eventType:"建檔"}] : [],
      propagationMethod: document.getElementById("ap-propagation").value,
      parentId: document.getElementById("ap-parent")?.value || null,
      motherId: document.getElementById("ap-mother")?.value || null,
      fatherId: document.getElementById("ap-father")?.value || null
    });
    pendingAddPlantPhoto = null;
  }
  else if(action==="open-move"){ openModal("move", { plantId: el.dataset.id }); }
  else if(action==="submit-move"){
    const plantId = el.dataset.plantId;
    movePlantSubmit(plantId,
      document.getElementById("mv-location").value,
      document.getElementById("mv-pot").value,
      document.getElementById("mv-date").value,
      document.getElementById("mv-reason").value,
      Number(document.getElementById("mv-split")?.value || 0));
  }
  else if(action==="open-death"){ markDeadStart(el.dataset.id); }
  else if(action==="submit-death"){
    markDeadConfirm(el.dataset.plantId, document.getElementById("dd-date").value, document.getElementById("dd-cause").value.trim());
  }
  else if(action==="open-sold"){ markSoldStart(el.dataset.id); }
  else if(action==="submit-sold"){
    markSoldConfirm(el.dataset.plantId, document.getElementById("sd-date").value, document.getElementById("sd-to").value.trim());
  }
  else if(action==="submit-market"){
    const input = document.getElementById("new-market-name");
    addMarket(input.value.trim());
    input.value = "";
  }
  else if(action==="submit-market-purchase"){
    const name = document.getElementById("mp-name").value.trim();
    if(!name){
      showToast("請先填寫植物名稱", "fa-circle-exclamation");
      document.getElementById("mp-name").focus();
      return;
    }
    addMarketPurchase({
      name,
      species: document.getElementById("mp-species").value.trim(),
      source: document.getElementById("mp-source").value,
      price: document.getElementById("mp-price").value,
      acquireDate: document.getElementById("mp-date").value,
      location: document.getElementById("mp-location").value,
      potSize: document.getElementById("mp-pot").value,
      isStaghorn: document.getElementById("mp-staghorn").checked
    });
  }
  else if(action==="open-add-material"){ openModal("addMaterial", {}); }
  else if(action==="submit-material"){
    const name = document.getElementById("mat-name").value.trim();
    if(!name) return;
    purchaseMaterialSubmit(name, document.getElementById("mat-qty").value, document.getElementById("mat-unit").value, document.getElementById("mat-cost").value, false);
  }
  else if(action==="submit-force-material"){
    purchaseMaterialSubmit(el.dataset.name, el.dataset.qty, el.dataset.unit, el.dataset.cost, true);
  }
  else if(action==="use-material"){ useMaterial(el.dataset.id); }
  else if(action==="submit-preset"){
    const name = document.getElementById("new-preset-name").value.trim();
    const ratio = document.getElementById("new-preset-ratio").value;
    if(name && ratio) addCnPreset(name, ratio);
  }
  else if(action==="remove-preset"){ removeCnPreset(el.dataset.id); }
  else if(action==="submit-compost"){
    const binId = el.dataset.binId;
    const material = document.getElementById(`compost-material-${binId}`).value;
    const weight = document.getElementById(`compost-weight-${binId}`).value;
    if(weight) addCompostInput(binId, material, weight);
  }
  else if(action==="open-add-compost-bin"){ openModal("addCompostBin", {}); }
  else if(action==="submit-compost-bin"){
    const name = document.getElementById("cb-name").value.trim();
    if(!name) return;
    addCompostBin(name, document.getElementById("cb-type").value, document.getElementById("cb-target").value);
  }
  else if(action==="open-add-sale"){ openModal("addSale", {}); }
  else if(action==="submit-sale"){
    const price = document.getElementById("sl-price").value;
    const cost = document.getElementById("sl-cost").value;
    if(price==="" || cost==="") return;
    addSaleSubmit(document.getElementById("sl-target").value, price, cost, document.getElementById("sl-buyer").value);
  }
  else if(action==="void-sale"){ voidSale(el.dataset.id); }
  else if(action==="open-add-crop"){ openModal("addCrop", {}); }
  else if(action==="submit-crop"){
    const name = document.getElementById("crop-name").value.trim();
    if(!name) return;
    addCrop(name, document.getElementById("crop-cost").value);
  }
  else if(action==="submit-harvest"){
    const id = el.dataset.id;
    const val = document.getElementById(`harvest-input-${id}`).value;
    if(val) addHarvest(id, val);
  }
  else if(action==="open-family-detail"){ openModal("familyDetail", { plantId: el.dataset.id }); }
  else if(action==="goto-plant-detail"){
    // 這裡新增族譜邏輯：從家族詳情面板跳轉到「植物總表」查看完整資料
    state.selectedPlantId = el.dataset.plantId;
    state.tab = "plants";
    closeModal();
    render();
    closeMobileNav();
  }
  else if(action==="voice-listen"){
    if(state.apiOffline) return;
    state.voice.listening = true; renderVoice();
    setTimeout(()=>{
      state.voice.listening = false;
      const box = document.getElementById("voice-text");
      if(box && !box.value){ state.voice.text = "買了兩盆" + (state.plants[0]?.species||"植物") + "三百元"; }
      renderVoice();
    }, 1400);
  }
  else if(action==="voice-parse"){
    const text = document.getElementById("voice-text").value;
    state.voice.text = text;
    if(!text) return;
    state.voice.parsed = parseVoiceCommand(text);
    renderVoice();
  }
  else if(action==="cancel-voice-parse"){ state.voice.parsed = null; renderVoice(); }
  else if(action==="confirm-voice"){ confirmVoiceEntry(); }
  else if(action==="resolve-ambiguity"){
    const target = state.plants.find(p=>p.id===el.dataset.id);
    state.voice.parsed = { ...state.voice.parsed, ambiguous:false, target };
    renderVoice();
  }
  else if(action==="voice-query"){
    const q = document.getElementById("query-text").value;
    state.voice.queryText = q;
    const knownNames = [...new Set(state.plants.map(p=>p.species))];
    const matched = knownNames.find(n=>q.includes(n));
    state.voice.queryResult = matched ? state.plants.filter(p=>p.species===matched && p.status==="存活") : [];
    renderVoice();
  }
  else if(action==="export-csv"){ exportCSV(); }
  else if(action==="preview-pdf"){
    const r = document.getElementById("pdf-result");
    r.classList.remove("hidden"); r.classList.add("flex");
  }
  else if(action==="api-toggle" || el.id==="api-toggle"){ /* handled below */ }
});

document.getElementById("api-toggle").addEventListener("click", function(){
  state.apiOffline = !state.apiOffline;
  render();
});

/* =========================================================================
   初始化
========================================================================= */
render();
</script>
