<script>
/* ===== 珍稀植物繁育管理：只供家族族譜頁使用 ===== */
const RARE_BREEDING_DATA = [
  {id:'PL-001', name:'二叉鹿角蕨 #001', species:'二叉鹿角蕨', generation:1, method:'原始母株', parent:null, rarity:5},
  {id:'PL-002', name:'二叉鹿角蕨 A-01', species:'二叉鹿角蕨', generation:2, method:'側芽繁殖', parent:'PL-001', rarity:4},
  {id:'PL-003', name:'二叉鹿角蕨 A-02', species:'二叉鹿角蕨', generation:2, method:'側芽繁殖', parent:'PL-001', rarity:4},
  {id:'PL-004', name:'二叉鹿角蕨 A-01-01', species:'二叉鹿角蕨', generation:3, method:'分株繁殖', parent:'PL-002', rarity:4},
  {id:'PL-005', name:'二叉鹿角蕨 A-01-01-01', species:'二叉鹿角蕨', generation:4, method:'分株繁殖', parent:'PL-004', rarity:5}
];

function genealogyNodeHTML(p, selectedId){
  const stars='★'.repeat(p.rarity)+'☆'.repeat(5-p.rarity);
  return `<div class="g-node ${p.id===selectedId?'selected':''}" onclick="selectGenealogyPlant('${p.id}')">
    <div style="font-size:22px">🌱</div>
    <strong>${p.name}</strong>
    <div style="font-size:13px;color:#6b7280">${p.species}</div>
    <div class="gen">第 ${p.generation} 代 · ${p.id}</div>
    <span class="method">${p.method}</span>
    <div style="margin-top:8px;font-size:12px">珍稀程度 ${stars}</div>
  </div>`;
}
function buildGenealogyTree(selectedId='PL-005'){
  const byId=Object.fromEntries(RARE_BREEDING_DATA.map(x=>[x.id,x]));
  const children={}; RARE_BREEDING_DATA.forEach(x=>{if(x.parent)(children[x.parent]??=[]).push(x.id)});
  function branch(id){
    const p=byId[id], kids=children[id]||[];
    return `<div class="g-child-wrap">${genealogyNodeHTML(p,selectedId)}
      ${kids.length?`<div class="g-children">${kids.map(branch).join('')}</div>`:''}
    </div>`;
  }
  const root=RARE_BREEDING_DATA.find(x=>!x.parent);
  return `<div class="g-tree">${branch(root.id)}</div>`;
}
function genealogyTrace(selectedId='PL-005'){
  const byId=Object.fromEntries(RARE_BREEDING_DATA.map(x=>[x.id,x]));
  const path=[]; let cur=byId[selectedId];
  while(cur){path.unshift(cur);cur=cur.parent?byId[cur.parent]:null;}
  return path.map((p,i)=>`<div class="g-trace-item ${i===0||i===path.length-1?'active':''}">
    <b>${i===0?'🌿 第一代母株':'🌱 第 '+p.generation+' 代子代'}</b><br>
    ${p.name}<span style="color:#6b7280"> · ${p.method}</span>
  </div>`).join('<div style="text-align:center;color:#9ca3af">↓</div>');
}
function selectGenealogyPlant(id){
  const p=RARE_BREEDING_DATA.find(x=>x.id===id); if(!p)return;
  const detail=document.getElementById('genealogy-detail');
  const trace=document.getElementById('genealogy-trace');
  if(detail) detail.innerHTML=`<div style="font-size:13px;color:#6b7280">目前選取</div>
    <h3 style="margin:6px 0">${p.name}</h3>
    <div class="g-stat-grid">
      <div class="g-stat">品種<b>${p.species}</b></div>
      <div class="g-stat">世代<b>第 ${p.generation} 代</b></div>
      <div class="g-stat">繁殖方式<b>${p.method}</b></div>
      <div class="g-stat">珍稀等級<b>${'★'.repeat(p.rarity)}</b></div>
    </div>
    <div style="margin-top:12px;color:#4b5563">母株：${p.parent ? (RARE_BREEDING_DATA.find(x=>x.id===p.parent)?.name||p.parent) : '原始母株'}</div>`;
  if(trace) trace.innerHTML=`<h3 style="margin-top:0">🔎 血統追蹤</h3>
    <p style="color:#6b7280">點擊任一子代，可沿血統線反查最原始母株。</p>
    <div class="g-trace-list">${genealogyTrace(id)}</div>
    <div style="margin-top:14px;padding:12px;border-radius:12px;background:#f0fdf4;color:#166534">
      ✓ 此植株可追溯至第一代母株：<b>${RARE_BREEDING_DATA[0].name}</b>
    </div>`;
  const tree=document.getElementById('genealogy-tree');
  if(tree) tree.innerHTML=buildGenealogyTree(id);
}
function renderBreedingGenealogyPage(){
  return `<div class="genealogy-breeding">
    <div>
      <div style="font-size:13px;color:#6b7280">珍稀植物繁育管理</div>
      <h2 style="margin:4px 0 8px">🌿 家族族譜</h2>
      <p style="color:#6b7280;margin:0">管理鹿角蕨親本、側芽與分株，建立多世代繁育脈絡。</p>
    </div>
    <div class="genealogy-toolbar">
      <select style="padding:10px 12px;border:1px solid #d1d5db;border-radius:10px">
        <option>全部品種</option><option>二叉鹿角蕨</option><option>安哥拉鹿角蕨</option><option>皇冠鹿角蕨</option><option>巨獸鹿角蕨</option>
      </select>
      <select style="padding:10px 12px;border:1px solid #d1d5db;border-radius:10px">
        <option>全部世代</option><option>第一代</option><option>第二代</option><option>第三代</option><option>第四代</option>
      </select>
      <span style="padding:10px 12px;background:#f0fdf4;color:#166534;border-radius:10px">🌱 已建立 ${RARE_BREEDING_DATA.length} 株繁育關聯</span>
    </div>
    <div class="g-stat-grid">
      <div class="g-stat">原生種管理<b>18 種</b></div>
      <div class="g-stat">繁育植株<b>${RARE_BREEDING_DATA.length} 株</b></div>
      <div class="g-stat">目前世代<b>第 4 代</b></div>
      <div class="g-stat">可追溯母株<b>100%</b></div>
    </div>
    <div class="genealogy-tree-card">
      <h3 style="margin-top:0">🌳 繁育系譜樹狀圖</h3>
      <p style="color:#6b7280">點擊任意節點查看繁殖方式，並反查最原始母株。</p>
      <div id="genealogy-tree" class="genealogy-tree">${buildGenealogyTree()}</div>
    </div>
    <div id="genealogy-detail" class="genealogy-info-card"></div>
    <div id="genealogy-trace" class="genealogy-trace-card"></div>
  </div>`;
}
</script>

 {id:"PL-001",name:"二叉鹿角蕨 #001",species:"二叉鹿角蕨",gen:1,method:"原始母株",parent:null,rarity:5,date:"2025/03/12"},
 {id:"PL-002",name:"二叉鹿角蕨 A-01",species:"二叉鹿角蕨",gen:2,method:"側芽繁殖",parent:"PL-001",rarity:4,date:"2025/08/20"},
 {id:"PL-003",name:"二叉鹿角蕨 A-02",species:"二叉鹿角蕨",gen:2,method:"側芽繁殖",parent:"PL-001",rarity:4,date:"2025/08/20"},
 {id:"PL-004",name:"二叉鹿角蕨 A-01-01",species:"二叉鹿角蕨",gen:3,method:"分株繁殖",parent:"PL-002",rarity:4,date:"2026/02/14"},
 {id:"PL-005",name:"二叉鹿角蕨 A-01-01-01",species:"二叉鹿角蕨",gen:4,method:"分株繁殖",parent:"PL-004",rarity:5,date:"2026/06/18"}
];
let BGV2_SELECTED="PL-005";
function bgv2Stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function bgv2Path(id){
 const map=Object.fromEntries(BGV2_PLANTS.map(p=>[p.id,p])), out=[]; let p=map[id];
 while(p){out.unshift(p);p=p.parent?map[p.parent]:null} return out;
}
function bgv2PlantCard(p){
 return `<div class="bgv2-plant ${p.id===BGV2_SELECTED?"selected":""}" onclick="BGV2_select('${p.id}')">
  <div class="bgv2-plant-top"><span class="bgv2-plant-name">🌿 ${p.name}</span><span class="bgv2-stars">${bgv2Stars(p.rarity)}</span></div>
  <div style="font-size:12px;color:#6b7280;margin-top:4px">第 ${p.gen} 代 · ${p.id}</div>
  <span class="bgv2-pill">${p.method}</span>
 </div>`;
}
function bgv2Timeline(id){
 const path=bgv2Path(id);
 return path.map((p,i)=>`<div class="bgv2-event">
  <div class="bgv2-event-date">${p.date}</div>
  <div class="bgv2-event-title">${i===0?"🌿 建立原始母株":p.method==="側芽繁殖"?"🌱 發現並建立側芽":"✂️ 完成分株並建立子代"}</div>
  <div class="bgv2-event-desc">${p.name} · 第 ${p.gen} 代 · ${p.method}</div>
 </div>`).join("");
}
function bgv2Trace(id){
 return bgv2Path(id).map((p,i)=>`<div class="bgv2-trace-item ${i===0||i===bgv2Path(id).length-1?"active":""}">
   <b>${i===0?"🌿 第一代母株":"🌱 第 "+p.gen+" 代"}</b>　${p.name}
 </div>`).join('<div style="text-align:center;color:#9ca3af">↓</div>');
}
function bgv2TreeNode(p){
 return `<div class="bgv2-node ${p.id===BGV2_SELECTED?"selected":""}" onclick="BGV2_select('${p.id}')">
   <div style="font-size:20px">🌱</div><b>${p.name}</b>
   <div style="font-size:12px;color:#6b7280">第 ${p.gen} 代</div>
   <div class="bgv2-node-method">${p.method}</div>
 </div>`;
}
function bgv2Tree(){
 const a=BGV2_PLANTS;
 return `<div class="bgv2-tree">
  ${bgv2TreeNode(a[0])}
  <div class="bgv2-branch">${bgv2TreeNode(a[1])}${bgv2TreeNode(a[2])}</div>
  <div style="margin-top:28px">${bgv2TreeNode(a[3])}</div>
  <div style="margin-top:28px">${bgv2TreeNode(a[4])}</div>
 </div>`;
}
function BGV2_select(id){
 BGV2_SELECTED=id;
 const p=BGV2_PLANTS.find(x=>x.id===id);
 const detail=document.getElementById("bgv2-detail"), trace=document.getElementById("bgv2-trace"), tree=document.getElementById("bgv2-tree"), list=document.getElementById("bgv2-list");
 if(!p)return;
 if(list)list.innerHTML=BGV2_PLANTS.map(bgv2PlantCard).join("");
 if(tree)tree.innerHTML=bgv2Tree();
 if(detail)detail.innerHTML=`<div class="bgv2-detail-head">
   <div><div class="bgv2-kicker">目前選取</div><h3 style="margin:3px 0">${p.name}</h3><div style="color:#6b7280;font-size:13px">${p.species} · ${p.id}</div></div>
   <span class="bgv2-badge">第 ${p.gen} 代</span>
  </div>
  <div style="margin-top:15px"><b>繁育旅程 80%</b><div class="bgv2-progress"><span></span></div><small style="color:#6b7280">完成母株、側芽、分株與子代建立紀錄</small></div>
  <div class="bgv2-timeline">${bgv2Timeline(id)}</div>`;
 if(trace)trace.innerHTML=`<h3 class="bgv2-section-title">🔎 血統追溯</h3>
   <p style="color:#6b7280;font-size:13px">從目前植株一路反查最原始母株。</p>
   <div class="bgv2-trace">${bgv2Trace(id)}</div>
   <div style="margin-top:12px;padding:11px;border-radius:11px;background:#f0fdf4;color:#166534">✓ 最初母株：<b>${BGV2_PLANTS[0].name}</b></div>`;
}
function renderBreedingGenealogyV2(){
 return `<div class="bgv2">
  <div class="bgv2-head"><div><div class="bgv2-kicker">珍稀植物 × 繁育管理</div><div class="bgv2-title">🌿 家族族譜</div><p class="bgv2-sub">從母株、側芽到子代，完整保存每一代的繁育履歷。</p></div>
   <div class="bgv2-tabs"><button class="bgv2-btn active">繁育履歷</button><button class="bgv2-btn" onclick="document.getElementById('bgv2-tree-anchor').scrollIntoView({behavior:'smooth'})">系譜圖</button></div>
  </div>
  <div class="bgv2-stats"><div class="bgv2-stat"><div class="bgv2-stat-label">珍稀品種</div><div class="bgv2-stat-num">8 種</div></div><div class="bgv2-stat"><div class="bgv2-stat-label">繁育植株</div><div class="bgv2-stat-num">31 株</div></div><div class="bgv2-stat"><div class="bgv2-stat-label">目前最高世代</div><div class="bgv2-stat-num">第 4 代</div></div><div class="bgv2-stat"><div class="bgv2-stat-label">血統可追溯</div><div class="bgv2-stat-num">100%</div></div></div>
  <div class="bgv2-layout">
   <div class="bgv2-panel"><h3 class="bgv2-section-title">🌱 我的繁育植物</h3><input class="bgv2-search" placeholder="搜尋植物名稱或編號..." oninput="BGV2_filter(this.value)"><div id="bgv2-list">${BGV2_PLANTS.map(bgv2PlantCard).join("")}</div></div>
   <div id="bgv2-detail" class="bgv2-panel"></div>
  </div>
  <div id="bgv2-tree-anchor" class="bgv2-bottom">
   <div class="bgv2-panel"><h3 class="bgv2-section-title">🌳 系譜圖</h3><p style="color:#6b7280;font-size:13px">點擊節點查看該植株的繁育資訊。</p><div id="bgv2-tree" class="bgv2-family">${bgv2Tree()}</div></div>
   <div id="bgv2-trace" class="bgv2-panel"></div>
  </div>
  <div class="bgv2-panel"><h3 class="bgv2-section-title">🏆 繁育成就進度</h3><div class="bgv2-achieve">
   <div class="bgv2-ach"><strong>🏆 繁育大師</strong><small>✓ 完成第一次分株</small></div>
   <div class="bgv2-ach"><strong>🌱 三代傳承</strong><small>✓ 已建立第三代</small></div>
   <div class="bgv2-ach"><strong>🌿 血脈延續</strong><small>3 / 5 株子代</small></div>
   <div class="bgv2-ach"><strong>👑 四代傳承者</strong><small>✓ 已達第四代</small></div>
  </div></div>
 </div>`;
}
function BGV2_filter(q){
 const list=document.getElementById("bgv2-list"); if(!list)return;
 q=q.toLowerCase(); list.innerHTML=BGV2_PLANTS.filter(p=>(p.name+p.id+p.species).toLowerCase().includes(q)).map(bgv2PlantCard).join("");
}
</script>

/* =========================================================================

function uid(p){ return (p||"") + Math.random().toString(36).slice(2,9); }

function nextPlantId(){
  const nums = state.plants.map(p => parseInt(p.id.replace("P",""),10)).filter(n=>!isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return "P" + String(next).padStart(5,"0");
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let pendingAddPlantPhoto = null;
let pendingAddPlantPhotoProcessing = false;

// 新增植物照片：先轉成可直接嵌入 HTML 的 Data URL，並縮小大照片，
// 避免使用 blob/object URL 導致換頁或重新開啟後圖片失效。
function previewAddPlantPhoto(e){
  const file = e.target.files && e.target.files[0];
  const preview = document.getElementById("ap-photo-preview");
  pendingAddPlantPhoto = null;
  pendingAddPlantPhotoProcessing = false;
  if(!file){
    if(preview) preview.innerHTML = `<span class="text-xs text-stone-400">尚未選擇圖片</span>`;
    return;
  }
  if(!file.type.startsWith("image/")){
    if(preview) preview.innerHTML = `<span class="text-xs text-red-500">請選擇圖片檔案</span>`;
    return;
  }

  pendingAddPlantPhotoProcessing = true;
  if(preview) preview.innerHTML = `<span class="text-xs text-stone-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i>照片處理中…</span>`;

  const reader = new FileReader();
  reader.onerror = function(){
    pendingAddPlantPhotoProcessing = false;
    if(preview) preview.innerHTML = `<span class="text-xs text-red-500">照片讀取失敗，請重新選擇</span>`;
  };
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxSide = 1400;
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
      const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      // JPEG 大幅降低手機照片的容量，讓資料能穩定放在植物資料裡。
      pendingAddPlantPhoto = canvas.toDataURL("image/jpeg", 0.82);
      pendingAddPlantPhotoProcessing = false;
      if(preview) preview.innerHTML = `<img src="${pendingAddPlantPhoto}" class="w-full h-full object-cover rounded-xl" alt="新增植物照片預覽">`;
    };
    img.onerror = function(){
      pendingAddPlantPhotoProcessing = false;
      if(preview) preview.innerHTML = `<span class="text-xs text-red-500">照片格式無法讀取，請重新選擇</span>`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================================
   本機自動保存：重整／關閉網頁後保留植物、照片、族譜與其他操作資料
   使用 localStorage，不改變原有操作流程。
========================================================================= */
const PLANT_MANAGER_STORAGE_KEY = "plant_manager_state_v4";
function saveState(){
  try{
    const snapshot = JSON.parse(JSON.stringify(state));
    // UI 暫態狀態不需要保存，避免重新開啟時直接進入某株詳情或彈窗。
    snapshot.selectedPlantId = null;
    snapshot.modal = null;
    snapshot.voice = { text:"", listening:false, parsed:null, queryText:"", queryResult:null };
    localStorage.setItem(PLANT_MANAGER_STORAGE_KEY, JSON.stringify(snapshot));
  }catch(err){
    console.warn("植物資料保存失敗", err);
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(PLANT_MANAGER_STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || !Array.isArray(saved.plants)) return false;
    state = Object.assign(state, saved);
    state.locations = Array.isArray(state.locations) && state.locations.length ? [...new Set(state.locations.map(x=>String(x).trim()).filter(Boolean))] : [...DEFAULT_LOCATIONS];
    LOCATIONS = [...state.locations];
    state.plants = Array.isArray(state.plants) ? state.plants : [];
    state.todayTasks = Array.isArray(state.todayTasks) ? state.todayTasks : [];
    state.todayTasks = state.todayTasks.map(t=>({
      id: t.id || uid("td"),
      title: String(t.title || "").trim(),
      sub: String(t.sub || "").trim(),
      done: !!t.done
    })).filter(t=>t.title);
    state.plants.forEach(p=>{
      p.photos = Array.isArray(p.photos) ? p.photos : [];
      p.moveHistory = Array.isArray(p.moveHistory) ? p.moveHistory : [];
      p.dispositionType = p.dispositionType || (p.status === "已出售" ? "sale" : p.status === "已轉讓" ? "transfer" : null);
      p.soldTo = p.soldTo || ""; p.salePrice = Number(p.salePrice)||0;
    });
    // 舊資料相容：為既有耗材補上採購、使用成本欄位，不影響原本庫存。
    state.materials = Array.isArray(state.materials) ? state.materials : [];
    state.materials.forEach(m=>{
      m.stock = Number(m.stock)||0;
      m.unitCost = Number(m.unitCost)||0;
      m.purchaseTotalCost = Number(m.purchaseTotalCost);
      if(!Number.isFinite(m.purchaseTotalCost)) m.purchaseTotalCost = m.stock * m.unitCost;
      m.usedQty = Number(m.usedQty)||0;
      m.usedCost = Number(m.usedCost)||0;
      m.unit = String(m.unit || "單位").trim() || "單位";
      m.usageHistory = Array.isArray(m.usageHistory) ? m.usageHistory : [];
      // 多批次單價：舊資料自動建立一個目前庫存批次，保留既有成本。
      m.batches = Array.isArray(m.batches) ? m.batches : [];
      if(!m.batches.length && m.stock > 0){
        m.batches.push({date:todayStr(), qty:m.stock, unit:m.unit, unitCost:m.unitCost||0, remainingQty:m.stock, totalCost:m.stock*(m.unitCost||0)});
      }
      m.batches.forEach(b=>{
        b.unit = String(b.unit || m.unit || "單位").trim() || "單位";
        b.qty = Math.max(0, Number(b.qty)||0);
        b.remainingQty = Math.max(0, Number(b.remainingQty ?? b.qty)||0);
        b.unitCost = Math.max(0, Number(b.unitCost)||0);
        b.totalCost = Number(b.totalCost);
        if(!Number.isFinite(b.totalCost)) b.totalCost=b.qty*b.unitCost;
      });
    });
    return true;
  }catch(err){
    console.warn("植物資料讀取失敗，使用原始資料", err);
    return false;
  }
}
loadState();

/* =========================================================================
   共用計算
========================================================================= */
function alivePlants(){ return state.plants.filter(p=>p.status==="存活"); }
function deadPlants(){ return state.plants.filter(p=>p.status==="已死亡"); }
function survivalRate(){
  return state.plants.length ? Math.round(alivePlants().length/state.plants.length*100) : 0;
}
function binCNRatio(bin){
  if(!bin.inputs.length) return null;
  const totalWeight = bin.inputs.reduce((s,i)=>s+i.weight,0);
  const weighted = bin.inputs.reduce((s,i)=>s+i.weight*i.ratio,0);
  return Math.round(weighted/totalWeight);
}
function marketStats(){
  return state.markets.map(m=>{
    const purchased = state.plants.filter(p=>p.source===m.id);
    const alive = purchased.filter(p=>p.status==="存活");
    return {...m, total:purchased.length, alive:alive.length,
      rate: purchased.length ? Math.round(alive.length/purchased.length*100) : 0};
  });
}
// 這裡新增族譜邏輯：以 parentId（無性）優先，其次 motherId（有性/交配種）決定血緣主線
function primaryParentId(p){ return p.parentId || p.motherId || null; }
// 家族族譜只管理鹿角蕨；非鹿角蕨維持一般植物資料，不加入族譜。
// 鹿角蕨即使沒有設定母株／父株，也會自動以「第 1 代母株」進入族譜。
function isGenealogyPlant(p){ return !!p && p.isStaghorn === true; }
function familyRoots(){ return state.plants.filter(p=>isGenealogyPlant(p) && !primaryParentId(p)); }
function familyChildren(id){ return state.plants.filter(p=>isGenealogyPlant(p) && primaryParentId(p)===id); }

function plantCurrentPotSize(p){
  // 以這一株自己的最新盆器歷程為準，避免目前盆器與歷程最後一筆對不起來。
  const history = Array.isArray(p.moveHistory) ? p.moveHistory : [];
  const latest = history.length ? history[history.length - 1] : null;
  return latest && latest.potSize != null ? latest.potSize : p.potSize;
}
function plantPotDisplay(p){
  // 每一筆植物資料只顯示自己的目前盆器；子代是獨立植物資料，
  // 不把子代盆器合併到母株，避免「盆器大小」與「盆器與場地歷程」對不起來。
  if(p.container) return p.container;
  const size = plantCurrentPotSize(p);
  return size ? `${size} 吋盆` : "尚未設定";
}
// 這裡新增族譜邏輯：植株的狀態燈號（綠/灰/紅）與文字說明
function plantStatusMeta(p){
  if(p.status==="存活"){
    return { dot:"bg-emerald-500", ring:"ring-emerald-100", label:`存活 · ${plantCurrentPotSize(p)}吋盆`, textCls:"text-emerald-700" };
  } else if(p.status==="已出售"){
    return { dot:"bg-stone-400", ring:"ring-stone-100", label:`已出售給 ${esc(p.soldTo||"未填寫")}`, textCls:"text-stone-500" };
  }
  return { dot:"bg-red-500", ring:"ring-red-100", label:`死因：${esc(p.deathCause||"未填寫")}`, textCls:"text-red-600 font-bold" };
}

function addPlant(data){
  // 這裡新增族譜邏輯：新增植物時可選擇 parentId（分株／側芽，無性）或
  // motherId + fatherId（交配種，有性）。若都沒有指定，視為外購/獨立植株（第 1 代）。
  const id = nextPlantId();
  const parentId = data.parentId || null;
  const motherId = data.motherId || null;
  const fatherId = data.fatherId || null;
  const linkedParent = parentId ? state.plants.find(p=>p.id===parentId)
                     : motherId ? state.plants.find(p=>p.id===motherId)
                     : null;
  const generation = linkedParent ? (linkedParent.generation||1)+1 : 1;
  // 鹿角蕨新增時即自動成為族譜中的根節點；若指定母株／父株，則自動接到對應血統。
  const normalizedGeneration = data.isStaghorn ? generation : 1;
  const newPlant = {
    id, name:data.name, species:data.species||data.name, isStaghorn:!!data.isStaghorn,
    source:data.source, price:Number(data.price)||0, acquireDate:data.acquireDate,
    status:"存活", location:data.location, potSize:Number(data.potSize)||4,
    parentId, motherId, fatherId, generation:normalizedGeneration,
    propagationMethod: data.propagationMethod || (parentId||motherId ? "分株" : "花市購入"),
    photos: data.photos || [],
    moveHistory:[{location:data.location, potSize:Number(data.potSize)||4, date:data.acquireDate}]
  };
  state.plants.push(newPlant);

  showToast(`已新增植物 ${id}`, "fa-seedling");
  closeModal();
  render();
}

  plant.status=mode==="sale"?"已出售":"已轉讓"; plant.dispositionType=mode; plant.dispositionDate=soldDate; plant.soldDate=soldDate; plant.soldTo=recipient; plant.salePrice=mode==="sale"?Number(salePrice):0;
  if(mode==="sale"){
    let exists=state.sales.find(x=>x.plantId===plant.id&&!x.voided);
    if(!exists){state.sales.push({id:uid("sl"),target:plant.name,plantId:plant.id,salePrice:Number(salePrice),cost:Number(plant.price)||0,buyer:recipient,date:soldDate,voided:false,source:"植物總表出售"});}
    showToast(`已出售 ${plant.name}，$${Number(salePrice).toLocaleString()} 已加入銷售`,"fa-dollar-sign");

  closeModal();render();
}

// 天氣資料：優先查 Open-Meteo 歷史氣象；查不到時才使用明確標示的備援估算。
async function fetchDeathWeather(plant, deathDate){
  const fallback = () => ({
    temp: Number((Math.random()*12+22).toFixed(1)),
    humidity: Math.round(Math.random()*25+55),
    weatherCode: null,
    weatherText: "備援估算（未取得歷史 API 資料）",
    location: plant.location || "未設定地點",
    source: "fallback",
    date: deathDate
  });

  if(state.apiOffline) return fallback();

  try{
    let latitude = null, longitude = null, resolvedLocation = plant.location || "";

    // 若植物地點本身是城市／地區名稱，直接用 Open-Meteo 地理編碼查詢。
    if(resolvedLocation){
      const geoUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(resolvedLocation) + "&count=1&language=zh&format=json";
      const geoRes = await fetch(geoUrl);
      if(geoRes.ok){
        const geo = await geoRes.json();
        const hit = geo?.results?.[0];
        if(hit){
          latitude = Number(hit.latitude);
          longitude = Number(hit.longitude);
          resolvedLocation = [hit.name, hit.admin1].filter(Boolean).join("，");
        }
      }
    }

    // 植物地點常是「陽台／後院溫室」這類室內標籤，無法地理編碼時，
    // 嘗試使用瀏覽器目前位置；若使用者拒絕，再走備援估算。
    if((latitude==null || longitude==null) && navigator.geolocation){
      const pos = await new Promise(resolve=>navigator.geolocation.getCurrentPosition(resolve, ()=>resolve(null), {enableHighAccuracy:false, timeout:2500, maximumAge:86400000}));
      if(pos){
        latitude = pos.coords.latitude;
        longitude = pos.coords.longitude;
        resolvedLocation = "裝置所在位置附近";
      }
    }

    if(latitude==null || longitude==null) return fallback();

    const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + latitude + "&longitude=" + longitude + "&start_date=" + encodeURIComponent(deathDate) + "&end_date=" + encodeURIComponent(deathDate) + "&hourly=temperature_2m,relative_humidity_2m,weather_code&timezone=auto";
    const res = await fetch(url);
    if(!res.ok) throw new Error("weather api " + res.status);
    const data = await res.json();
    const temps = (data?.hourly?.temperature_2m || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    const hums = (data?.hourly?.relative_humidity_2m || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    const codes = (data?.hourly?.weather_code || []).filter(v=>Number.isFinite(Number(v))).map(Number);
    if(!temps.length) throw new Error("no weather data");

    const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
    const code = codes.length ? Math.round(codes.reduce((a,b)=>a+b,0)/codes.length) : null;
    const weatherNames = {
      0:"晴朗",1:"大致晴朗",2:"局部多雲",3:"陰天",45:"霧",48:"霧凇",
      51:"小毛雨",53:"毛雨",55:"大毛雨",61:"小雨",63:"中雨",65:"大雨",
      71:"小雪",73:"中雪",75:"大雪",80:"小陣雨",81:"陣雨",82:"大陣雨",
      95:"雷雨",96:"雷雨伴冰雹",99:"強雷雨伴冰雹"
    };
    return {
      temp: Number(avg(temps).toFixed(1)),
      humidity: hums.length ? Math.round(avg(hums)) : null,
      weatherCode: code,
      weatherText: weatherNames[code] || "歷史氣象",
      location: resolvedLocation,
      latitude: Number(latitude.toFixed(5)),
      longitude: Number(longitude.toFixed(5)),
      source: "Open-Meteo",
      date: deathDate
    };
  }catch(err){
    console.warn("死亡日期氣象查詢失敗，改用備援資料", err);
    return fallback();
  }
}

}

function movePlantSubmit(plantId, location, potSize, date, reason, splitCount, customReason){
  const plant = state.plants.find(p=>p.id===plantId);
  if(!plant) return;
  const finalReason = reason==="其他" ? (customReason||"其他原因") : reason;
  plant.location = location;
  plant.potSize = Number(potSize);
  plant.moveHistory = Array.isArray(plant.moveHistory) ? plant.moveHistory : [];
  plant.moveHistory.push({location, potSize:Number(potSize), date, reason:finalReason});
  if(reason==="分株" && splitCount>0){
    for(let i=0;i<splitCount;i++){
      const newId = nextPlantId();
      state.plants.push({
        id:newId, name:`${plant.name}-子代${i+1}`, species:plant.species, isStaghorn:plant.isStaghorn,
        source:plant.source, price:0, acquireDate:date, status:"存活", location, potSize:Number(potSize),
        parentId:plant.id, generation:(plant.generation||1)+1, propagationMethod:"分株", photos:[],
        moveHistory:[{location, potSize:Number(potSize), date}]
      });
    }

  }

  showToast(reason==="分株" ? `已完成分株，新增 ${splitCount} 株子代` : `已更新換盆紀錄：${finalReason}`, "fa-box");
  closeModal();
  render();
}

function purchaseMaterialSubmit(name, qty, unit, cost, force, source=""){
  const quantity = Math.max(0, Number(qty)||0);
  const unitCost = Math.max(0, Number(cost)||0);
  if(quantity<=0){ showToast("請輸入大於 0 的採購數量", "fa-circle-exclamation"); return; }
  const existing = state.materials.find(m=>m.name.trim()===name.trim());
  const existingStock = existing ? (Number(existing.stock)||0) : 0;
  if(existing && existingStock > 0 && !force){
    openModal("duplicateWarning", { name, qty, unit, cost, existingId: existing.id });
    return;
  }
  if(existing){
    existing.batches = Array.isArray(existing.batches) ? existing.batches : [];
    existing.batches.push({date:todayStr(), qty:quantity, unit:unit || existing.unit, remainingQty:quantity, unitCost, totalCost:quantity*unitCost});
    existing.purchaseHistory = Array.isArray(existing.purchaseHistory) ? existing.purchaseHistory : [];
    existing.purchaseHistory.push({date:todayStr(), qty:quantity, unit:unit || existing.unit, unitCost, totalCost:quantity*unitCost});
    existing.stock = existing.batches.reduce((sum,b)=>sum+(Number(b.remainingQty)||0),0);
    existing.unit = unit || existing.unit;
    existing.unitCost = unitCost; // 僅作為最新批次單價顯示
    existing.purchaseTotalCost = (Number(existing.purchaseTotalCost)||0) + quantity * unitCost;
    existing.usageHistory = Array.isArray(existing.usageHistory) ? existing.usageHistory : [];
    existing.usedQty = Number(existing.usedQty)||0;
    existing.usedCost = Number(existing.usedCost)||0;
    if(String(source||"").trim()){ existing.source=String(source).trim(); state.resourceSources=Array.isArray(state.resourceSources)?state.resourceSources:[]; if(!state.resourceSources.includes(existing.source)) state.resourceSources.push(existing.source); }
  } else {
    state.materials.push({
      id:uid("mt"), name, stock:quantity, unit, unitCost,
      purchaseTotalCost:quantity*unitCost, usedQty:0, usedCost:0, usageHistory:[], purchaseHistory:[{date:todayStr(), qty:quantity, unit:unit || "單位", unitCost, totalCost:quantity*unitCost}],
      batches:[{date:todayStr(), qty:quantity, unit:unit || "單位", remainingQty:quantity, unitCost, totalCost:quantity*unitCost}],
      source:String(source||"").trim(), createdAt:Date.now()
    });
  }
  closeModal();
  showToast(`已新增採購批次：${quantity} ${unit||existing?.unit||"單位"} × $${unitCost.toLocaleString()}`, "fa-box");
  saveState();
  render();
}

function useMaterial(id){
  const m = state.materials.find(x=>x.id===id);
  if(!m) return;
  m.stock = Number(m.stock)||0;
  if(m.stock<=0){
    showToast(`${m.name} 已無庫存`, "fa-circle-exclamation");
    return;
  }
  m.batches = Array.isArray(m.batches) ? m.batches : [];
  let remaining=1;
  let usedCost=0;
  const usageDetails=[];
  for(const batch of m.batches){
    if(remaining<=0) break;
    const available=Math.max(0,Number(batch.remainingQty)||0);
    if(available<=0) continue;
    const take=Math.min(available,remaining);
    batch.remainingQty=available-take;
    usedCost += take*(Number(batch.unitCost)||0);
    usageDetails.push({date:batch.date, qty:take, unitCost:Number(batch.unitCost)||0});
    remaining -= take;
  }
  if(remaining>0){ showToast("庫存批次資料不足，請先同步庫存", "fa-circle-exclamation"); return; }
  m.stock = m.batches.reduce((sum,b)=>sum+(Number(b.remainingQty)||0),0);
  m.usedQty = (Number(m.usedQty)||0) + 1;
  m.usedCost = (Number(m.usedCost)||0) + usedCost;
  m.usageHistory = Array.isArray(m.usageHistory) ? m.usageHistory : [];
  m.usageHistory.push({date:todayStr(), qty:1, unitCost:usedCost, cost:usedCost, fifo:usageDetails});
  // 最新一個仍有庫存的批次單價作為目前顯示單價。
  const latestOpen=[...m.batches].reverse().find(b=>(Number(b.remainingQty)||0)>0);
  if(latestOpen) m.unitCost=Number(latestOpen.unitCost)||0;
  showToast(`已使用 1 ${m.unit} ${m.name}，FIFO 成本 +$${usedCost.toLocaleString()}`, "fa-toolbox");

  saveState();
  render();
}

/* =========================================================================
   AI 語音
========================================================================= */
function findVoiceResourceMatch(text){
  const tool = state.tools.find(t=>t.name && text.includes(t.name));
  if(tool) return { kind:"tool", item:tool };
  const material = state.materials.find(m=>m.name && text.includes(m.name));
  if(material) return { kind:"material", item:material };
  return null;
}
function parseVoiceCommand(text){
  let action = "未知";
  if(/買|購入/.test(text)) action = "購入";
  else if(/賣|售出/.test(text)) action = "售出";
  else if(/澆水/.test(text)) action = "澆水";

  // 優先嘗試整句一次抓出「(數量)(單位) 名稱 金額元」，例如「買了兩盆百合花300元」，
  // 這樣就算是資料庫裡從沒出現過的全新品種，也能直接用語音講出的名稱建檔，不用先手動新增過一次。
  const purchaseMatch = action==="購入"
    ? text.match(/(?:買了|購入)\s*([0-9零〇一二兩三四五六七八九十百千萬億]+)?\s*(盆|株|棵|朵|顆|包|罐|瓶|個)?\s*([\u4e00-\u9fffA-Za-z0-9]+?)\s*([0-9]+)\s*(?:元|塊|块)?[。.!！]?\s*$/)
    : null;

  if(purchaseMatch){
    const qtyRaw = purchaseMatch[1] ? Number(chineseNumberToArabic(purchaseMatch[1])) : 1;
    const qty = qtyRaw>0 ? qtyRaw : 1;
    const nameGuess = purchaseMatch[3];
    const amount = Number(purchaseMatch[4]) || null;

    // 先確認講的是不是現有的工具／耗材品項
    const resourceMatch = findVoiceResourceMatch(text);
    if(resourceMatch){
      const unit = purchaseMatch[2] || resourceMatch.item.unit || "個";
      return { ambiguous:false, type:"resource", resourceKind:resourceMatch.kind, resourceId:resourceMatch.item.id, resourceName:resourceMatch.item.name, action, amount, qty, unit, rawText:text };
    }

    // 否則當成新一批植物購入：不論品種資料庫裡有沒有，都用講出來的名稱建檔
    const candidates = state.plants.filter(p=>p.species===nameGuess && p.status==="存活");
    const hints = { "窗台":"窗邊", "門口":"門口", "角落":"角落" };
    const hintKey = Object.keys(hints).find(h=>text.includes(h));
    if(candidates.length>1 && !hintKey){
      return { ambiguous:true, type:"plant", species:nameGuess, candidates, action, amount, qty, rawText:text };
    }
    const target = hintKey ? (candidates.find(c=>c.location.includes(hints[hintKey])) || candidates[0]) : candidates[0];
    return { ambiguous:false, type:"plant", species:nameGuess, target, action, amount, qty, rawText:text };
  }

  // 備援：句型不完全符合上面的格式時，退回舊有邏輯（只認資料庫裡已存在的品種名稱）。
  const amountMatch = text.match(/(\d+)\s*(?:元|塊|块)?[。.!！]?\s*$/);
  const amount = amountMatch ? Number(amountMatch[1]) : null;
  const knownNames = [...new Set(state.plants.map(p=>p.species))];
  const matchedSpecies = knownNames.find(n=>text.includes(n));

  if(matchedSpecies){
    const candidates = state.plants.filter(p=>p.species===matchedSpecies && p.status==="存活");
    const hints = { "窗台":"窗邊", "門口":"門口", "角落":"角落" };
    const hintKey = Object.keys(hints).find(h=>text.includes(h));
    if(candidates.length>1 && !hintKey){
      return { ambiguous:true, type:"plant", species:matchedSpecies, candidates, action, amount, qty:1, rawText:text };
    }
    const target = hintKey ? (candidates.find(c=>c.location.includes(hints[hintKey])) || candidates[0]) : candidates[0];
    return { ambiguous:false, type:"plant", species:matchedSpecies, target, action, amount, qty:1, rawText:text };
  }

  // 語音新增工具／耗材：句子裡出現「購入」＋金額＋現有工具或耗材名稱時，視為一筆新採購。
  if(action==="購入" && amount){
    const resourceMatch = findVoiceResourceMatch(text);
    if(resourceMatch){
      const qtyMatch = text.match(/(\d+(?:\.\d+)?)\s*(包|罐|瓶|公斤|公克|ml|L|朵|株|個|捲|桶|份|支|把|台|組|套|件|張|盆|塊|片|次)/);
      const qty = qtyMatch ? Number(qtyMatch[1]) : 1;
      const unit = qtyMatch ? qtyMatch[2] : (resourceMatch.item.unit || "個");
      return { ambiguous:false, type:"resource", resourceKind:resourceMatch.kind, resourceId:resourceMatch.item.id, resourceName:resourceMatch.item.name, action, amount, qty, unit, rawText:text };
    }
  }
  return { ambiguous:false, type:"plant", species:null, target:null, action, amount, qty:1, rawText:text };
}
function restockToolFromVoice(id, qty, unitCost, source){
  const t = state.tools.find(x=>x.id===id);
  if(!t) return;
  const addQty = Math.max(0, Number(qty)||0);
  const cost = Math.max(0, Number(unitCost)||0);
  t.qty = (Number(t.qty)||0) + addQty;
  t.unitCost = cost || t.unitCost;
  t.purchasedTotal = (Number(t.purchasedTotal)||0) + addQty*cost;
  if(String(source||"").trim()){
    t.source = String(source).trim();
    state.resourceSources = Array.isArray(state.resourceSources) ? state.resourceSources : [];
    if(!state.resourceSources.includes(t.source)) state.resourceSources.push(t.source);
  }
  saveState();
}
function confirmVoiceEntry(){
  const parsed = state.voice.parsed;
  if(parsed.type==="resource" && parsed.action==="購入" && parsed.amount){
    const qty = Math.max(1, Number(parsed.qty)||1);
    const unitCost = qty ? (Number(parsed.amount)||0)/qty : (Number(parsed.amount)||0);
    if(parsed.resourceKind==="tool"){
      restockToolFromVoice(parsed.resourceId, qty, unitCost, "");
      showToast(`已為工具「${parsed.resourceName}」新增庫存`, "fa-screwdriver-wrench");
    } else {
      purchaseMaterialSubmit(parsed.resourceName, qty, parsed.unit, unitCost, true, "");
    }
    state.voice = { text:"", listening:false, parsed:null, queryText:"", queryResult:null };
    render();
    return;
  }
  if(parsed.action==="購入" && parsed.amount){
    const qty = Math.max(1, Number(parsed.qty)||1);
    const unitPrice = qty>1 ? Math.round((Number(parsed.amount)||0)/qty) : (Number(parsed.amount)||0);
    for(let i=0;i<qty;i++){
      addPlant({ name:parsed.species||"語音建檔植物", species:parsed.species,
        source: state.markets[0]?.id, price:unitPrice, acquireDate: todayStr(),
        location: LOCATIONS[0], potSize:4 });
    }
    showToast(qty>1?`已新增 ${qty} 株「${parsed.species||"植物"}」`:"語音資料已確認寫入資料庫", "fa-check");
    state.voice = { text:"", listening:false, parsed:null, queryText: state.voice.queryText, queryResult: state.voice.queryResult };
    render();
    return;
  }


  showToast("語音資料已確認寫入資料庫", "fa-check");
  state.voice = { text:"", listening:false, parsed:null, queryText: state.voice.queryText, queryResult: state.voice.queryResult };
  render();
}

function handlePlantListPhotoUpload(e, plantId){
  const file = e.target.files && e.target.files[0];
  if(!file || !file.type.startsWith("image/")) { showToast("請選擇圖片檔案", "fa-image"); return; }
  const plant = state.plants.find(p=>p.id===plantId);
  if(!plant) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxSide=1400, scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
      const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
      const canvas=document.createElement("canvas"); canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      plant.photos=Array.isArray(plant.photos)?plant.photos:[];
      plant.photos.push({id:uid("ph"),url:canvas.toDataURL("image/jpeg",0.82),date:todayStr(),eventType:"植物總表紀錄"});
      saveState();
      showToast(`已為 ${plant.name} 新增照片紀錄`, "fa-camera");
      renderPlants();
    };
    img.onerror=()=>showToast("照片無法讀取，請重新選擇", "fa-triangle-exclamation");
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value="";
}

      <span class="truncate">${n.label}</span>
    </button>`).join("");
  const banner = document.getElementById("offline-banner");
  banner.className = state.apiOffline
    ? "mb-4 bg-orange-100 border border-orange-300 text-orange-800 text-sm rounded-2xl px-4 py-3 flex items-center gap-2"
    : "hidden";

  const apiBtn = document.getElementById("api-toggle");
  const apiLabel = document.getElementById("api-toggle-label");
  const apiIcon = document.getElementById("api-toggle-icon");
  if(state.apiOffline){
    apiBtn.className = "w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs transition-all duration-300 hover:scale-105 active:scale-95 bg-orange-800/70 text-orange-100";
    apiIcon.textContent = "🔌";
    apiLabel.textContent = "模擬外部 API 斷線中";
  } else {
    apiBtn.className = "w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs transition-all duration-300 hover:scale-105 active:scale-95 bg-emerald-900/60 text-emerald-100";
    apiIcon.textContent = "📶";
    apiLabel.textContent = "外部 API 連線正常";
  }
}

    {icon:'fa-droplet',title:'檢查澆水',sub:`目前共有 ${state.plants.filter(p=>p.status==='存活').length} 株存活植物`,done:false},

  }).join(''):`<div class="text-xs text-stone-400 py-8 text-center">尚未新增植物，先建立你的第一株植物吧。</div>`;

    <section class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">

  const filteredPlants = state.plants.filter(p => plantFilter==='全部' || p.status===plantFilter);

            <span class="absolute bottom-3 left-3 text-[10px] px-2.5 py-1 rounded-full bg-black/45 text-white backdrop-blur-sm">

  const mother = p.motherId ? state.plants.find(x=>x.id===p.motherId) : null;
  const father = p.fatherId ? state.plants.find(x=>x.id===p.fatherId) : null;
  const children = familyChildren(p.id);
  const statusClass = p.status==="存活"
    ? "bg-emerald-100 text-emerald-700"

/* =========================================================================
   植株關係圖 — 這裡新增族譜邏輯：改版為「標註照片＋近期紀錄＋詳情面板」樣式
   資料模型：parentId = 無性繁殖（分株／側芽）；motherId + fatherId = 有性繁殖（交配種）

========================================================================= */
// 這裡新增族譜邏輯：三種血緣關係的顏色／圖示／說明文字
const FAMILY_CATEGORY_META = {
  "側芽": { color:"blue",   icon:"fa-seedling", desc:"從母株旁邊長出的小芽，未來長大即可分離培育成獨立植株。" },
  "分株": { color:"purple", icon:"fa-hand-scissors", desc:"植株長大後將根莖分切開來，直接形成獨立的新植株。" },
  "交配種": { color:"amber",  icon:"fa-dna", desc:"由母株與父株進行有性繁殖（孢子交配）所培育出的新品種。" }
};
const FAMILY_COLOR_CLASSES = {
  blue:   { dot:"bg-blue-500",   pill:"bg-blue-500",   soft:"bg-blue-100 text-blue-700" },
  purple: { dot:"bg-purple-500", pill:"bg-purple-500", soft:"bg-purple-100 text-purple-700" },
  amber:  { dot:"bg-amber-500",  pill:"bg-amber-500",  soft:"bg-amber-100 text-amber-700" }
};
// 這裡新增族譜邏輯：標註色點在照片上的預設位置（依序輪流使用，避免重疊）
const FAMILY_PIN_POSITIONS = [
  {top:"12%", left:"66%"}, {top:"55%", left:"12%"}, {top:"70%", left:"72%"},
  {top:"30%", left:"20%"}, {top:"78%", left:"38%"}, {top:"15%", left:"38%"}

function plantThumbUrl(p){
  if(p.photos && p.photos.length){
    const sorted = [...p.photos].sort((a,b)=>a.date<b.date?1:-1);
    return sorted[0].url;
  }
  return null;
}
function statusPillClasses(status){
  return status==="存活" ? "bg-emerald-100 text-emerald-700"
       : status==="已出售" ? "bg-stone-200 text-stone-500"
       : "bg-red-100 text-red-600";
}
// 這裡新增族譜邏輯：判斷一株植物相對於母株的繁殖關係類別
function plantFamilyCategory(plant){
  if(plant.motherId) return "交配種";
  if(plant.parentId) return plant.propagationMethod==="分株" ? "分株" : "側芽";
  return null;
}
// 這裡新增族譜邏輯：為每個子代自動產生一句簡短描述
function familyChildDesc(plant, category){
  if(category==="交配種") return `與父株進行有性繁殖後培育出的新品種，目前${plant.status}。`;
  if(category==="分株") return `由母株分切根莖形成的獨立植株，目前${plant.status}。`;
  return `從母株旁長出的側芽，目前${plant.status}${plant.status==="存活"?`（${plant.potSize}吋盆）`:""}。`;
}
// 這裡新增族譜邏輯：依植株種類給出簡短照顧建議
function familyCareTip(plant){

    return "維持通風與適度日照，孢子葉請勿摘除；側芽長至約 3 吋大小、根系穩定後再分離較容易存活。";
  }
  return "分株或側芽移植後前 2 週應放置於遮陰處緩苗，並維持土壤微濕，待新根長出後再恢復正常光照與澆水頻率。";

function collectFamilyCards(){
  const result = [];
  function walk(node){
    if(!isGenealogyPlant(node)) return;
    if(familyChildren(node.id).length){
      result.push(node);
      familyChildren(node.id).forEach(walk);
    }
  }
  familyRoots().forEach(walk);
  return result;
}

function backToGenealogyRoots(){
  state.genealogyFocusId = null;
  renderGenealogy();
}

function bgFamilyPath(id){
  const path=[];
  let current=state.plants.find(p=>p.id===id);
  while(current){
    path.unshift(current);
    const parent=primaryParentId(current);
    current=parent ? state.plants.find(p=>p.id===parent) : null;
  }
  return path.map((p,i)=>`
    <button onclick="focusGenealogy('${p.id}')"
      class="shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl bg-white border ${p.id===id?'border-emerald-400':'border-stone-100'} hover:border-emerald-300">
      <i class="fa-solid fa-seedling text-emerald-600"></i>
      <span class="text-xs font-medium text-stone-700">${esc(p.name)}</span>
      <span class="text-[9px] text-stone-400">第${p.generation||1}代</span>
    </button>
    ${i<path.length-1?'<i class="fa-solid fa-chevron-right text-stone-300 shrink-0"></i>':''}
  `).join("");
}

// 花市搜尋框：重新渲染後把游標焦點還原，輸入時才不會一直跳掉
function handleMarketSearch(el){
  const pos = el.selectionStart;
  marketUIState.search = el.value;
  renderMarket();
  const el2 = document.getElementById("market-search");
  if(el2){ el2.focus(); try{ el2.setSelectionRange(pos, pos); }catch(e){} }
}

function renderMarket(){

  const allStats = marketStats().sort((a,b)=>b.rate-a.rate);
  const filteredStats = allStats.filter(m=>matchesQuery(m.name));
  const visibleStats = marketUIState.showAllStats ? filteredStats : filteredStats.slice(0,6);

  const filteredMarkets = [...state.markets].filter(m=>matchesQuery(m.name)).reverse();

  const marketOptions = state.markets.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("");
  const locationOptions = LOCATIONS.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join("");

  // 依採購筆數／花費排序，最常往來的花市排最前面；花市一多也不會亂

    const purchases = state.plants.filter(p=>p.source===m.id).sort((a,b)=>(b.acquireDate||"").localeCompare(a.acquireDate||""));
    const total = purchases.reduce((sum,p)=>sum+(Number(p.price)||0),0);
    return {id:m.id, name:m.name, purchases, total};

function syncLocations(){
  state.locations = [...LOCATIONS];
  saveState();
}
function addLocation(){
  openModal("addLocation", {});
}
function submitLocation(){
  const input=document.getElementById("loc-name");
  if(!input)return;
  const value=input.value.trim();
  if(!value){ showToast("場地名稱不能空白", "fa-location-dot"); input.focus(); return; }
  if(LOCATIONS.includes(value)){ showToast("這個場地已經存在", "fa-circle-exclamation"); input.focus(); return; }
  LOCATIONS.push(value);
  syncLocations();
  showToast(`已新增場地：${value}`, "fa-location-dot");
  closeModal();
  // 新增場地後重新渲染目前頁面。
  // renderLocationsAndMap() 位於擴充層 IIFE 內，這裡不能直接呼叫，改用公開的 renderMain。
  if(typeof window.renderMain === "function"){
    window.renderMain();
  }else if(typeof window.render === "function"){
    window.render();
  }
}
function renameLocation(index){
  const oldName=LOCATIONS[index];
  if(oldName===undefined)return;
  openModal("renameLocation", {index, name:oldName});
}
function submitRenameLocation(index){
  const oldName=LOCATIONS[index];
  if(oldName===undefined)return;
  const input=document.getElementById("loc-name");
  const value=input?.value.trim()||"";
  if(!value){showToast("場地名稱不能空白", "fa-location-dot"); input?.focus(); return;}
  if(value!==oldName && LOCATIONS.includes(value)){showToast("這個場地名稱已存在", "fa-circle-exclamation"); input?.focus(); return;}
  state.plants.forEach(p=>{
    if(p.location===oldName){
      p.location=value;
      (p.moveHistory||[]).forEach(h=>{if(h.location===oldName)h.location=value;});
    }
  });
  LOCATIONS[index]=value;
  syncLocations();
  showToast(`已將「${oldName}」改為「${value}」`, "fa-pen");
  closeModal();
  renderLocations();
}
function deleteLocation(index){
  const name=LOCATIONS[index];
  if(name===undefined)return;
  const used=state.plants.filter(p=>p.location===name).length;
  if(used>0){ showToast(`「${name}」目前有 ${used} 株植物使用，請先移到其他場地`, "fa-triangle-exclamation"); return; }
  openModal("deleteLocation", {index, name});
}
function submitDeleteLocation(index){
  const name=LOCATIONS[index];
  if(name===undefined)return;
  const used=state.plants.filter(p=>p.location===name).length;
  if(used>0){ closeModal(); showToast(`「${name}」目前有 ${used} 株植物使用，請先移到其他場地`, "fa-triangle-exclamation"); return; }
  LOCATIONS.splice(index,1);
  if(!LOCATIONS.length){ LOCATIONS.push("未設定場地"); }
  syncLocations();
  showToast(`已刪除場地：${name}`, "fa-trash");
  closeModal();
  renderLocations();
}

function csvCell(value){
  const s = value==null ? "" : String(value);
  return `"${s.replace(/"/g,'""')}"`;
}
function downloadCSV(filename, rows){
  const csv = rows.map(row=>row.map(csvCell).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportExpenseTableCSV(){
  const plantCost = state.plants.reduce((s,p)=>s+(Number(p.price)||0),0);
  const toolCost = (state.tools||[]).reduce((s,t)=>s+(Number(t.purchasedTotal) ?? ((Number(t.qty)||0)*(Number(t.unitCost)||0))),0);
  const materialCost = (state.materials||[]).reduce((s,m)=>s+(Number(m.purchaseTotalCost)||((Number(m.stock)||0)*(Number(m.unitCost)||0))),0);
  const compostCost = state.compostBins.reduce((s,b)=>
    s+(Array.isArray(b.inputs)?b.inputs.reduce((a,i)=>a+(Number(i.cost)||0),0):0),0);
  const potCost = state.plants.reduce((s,p)=>
    s+(Array.isArray(p.moveHistory)?p.moveHistory.reduce((a,h)=>a+(Number(h.cost)||Number(h.price)||0),0):0),0);
  const otherCost = (state.expenses||[]).reduce((s,e)=>s+(Number(e.amount)||0),0) + materialCost + potCost + compostCost;
  const salesTotal = state.sales.filter(x=>!x.voided).reduce((s,x)=>s+(Number(x.salePrice)||0),0);
  const rows = [
    ["花費分類","金額","占總花費比例"],
    ["植物購買",Math.round(plantCost),0],["工具",Math.round(toolCost),0],["其他",Math.round(otherCost),0]
  ];
  const total=rows.slice(1).reduce((s,r)=>s+Number(r[1]||0),0);
  rows.slice(1).forEach(r=>r[2]=total?`${Math.round(r[1]/total*100)}%`:"0%");
  rows.push(["總花費",total,"100%"]);
  rows.push(["",""," "]);
  rows.push(["植物售出（收入，不計入花費）",Math.round(salesTotal),""]);
  downloadCSV(`植物管家_花費結構_${todayStr()}.csv`,rows);
  showToast("花費結構表已下載", "fa-download");
}
function exportFullReportCSV(){
  const rows=[["報表類型","項目","金額/數量","日期","備註"]];
  state.plants.forEach(p=>rows.push(["植物購買",p.name,Math.round(Number(p.price)||0),p.acquireDate||"",p.species||""]));
  (state.tools||[]).forEach(t=>{
    const amount=Number(t.purchasedTotal) ?? ((Number(t.qty)||0)*(Number(t.unitCost)||0));
    if(amount>0) rows.push(["工具",t.name,Math.round(amount),"",`目前庫存 ${t.qty||0} ${t.unit||""}；來源 ${t.source||"未填寫"}`]);
  });
  (state.materials||[]).forEach(m=>{
    const history=Array.isArray(m.purchaseHistory)&&m.purchaseHistory.length
      ? m.purchaseHistory
      : [{date:"",qty:m.stock,unit:m.unit,totalCost:Number(m.purchaseTotalCost)||((Number(m.stock)||0)*(Number(m.unitCost)||0))}];
    history.forEach(r=>{
      const amount=Number(r.totalCost)||0;
      if(amount>0) rows.push(["耗材採購",m.name,Math.round(amount),r.date||"",`購入 ${Number(r.qty)||0} ${r.unit||m.unit||""}`]);
    });
    (m.usageHistory||[]).forEach(u=>rows.push(["耗材使用",m.name,Math.round(Number(u.cost)||0),u.date||"",`使用 ${u.qty||1} ${m.unit||""}`]));
  });
  state.sales.filter(s=>!s.voided).forEach(s=>rows.push(["銷售",s.target,Math.round(Number(s.salePrice)||0),s.date||"",`成本 ${Math.round(Number(s.cost)||0)}；淨利潤 ${Math.round((Number(s.salePrice)||0)-(Number(s.cost)||0))}`]));
  state.compostBins.forEach(b=>(b.inputs||[]).forEach(i=>rows.push(["堆肥",i.material||"",Number(i.cost)||0,i.date||"",`${b.name||""}；${i.weight||0}g`])));
  downloadCSV(`植物管家_完整報表_${todayStr()}.csv`,rows);
  showToast("完整報表已下載", "fa-download");
}

function renderReports(){
  const salesTotal = state.sales.filter(x=>!x.voided).reduce((s,x)=>s+(Number(x.salePrice)||0),0);
  const plantCost = state.plants.reduce((s,x)=>s+(Number(x.price)||0),0);
  const compostCost = state.compostBins.reduce((s,x)=>
    s + (Array.isArray(x.inputs) ? x.inputs.reduce((a,i)=>a+(Number(i.cost)||0),0) : 0),0);

  // 耗材：改用「實際採購花費」計算（累計採購成本，不會因為用掉多少而減少），
  // 這樣才能跟下方明細（每一筆採購紀錄）的加總對得起來。
  const consumableCost = (state.materials || []).reduce((s,x)=>
    s + (Number(x.purchaseTotalCost)||((Number(x.stock)||0)*(Number(x.unitCost)||0))),0);

  // 工具：累計投入成本（使用 1 只會扣庫存數量，不會讓這筆花費跟著變少）
  const toolCost = (state.tools || []).reduce((s,t)=>
    s + (Number(t.purchasedTotal) ?? ((Number(t.qty)||0)*(Number(t.unitCost)||0))),0);

  // 盆器：從植物目前盆器/移動歷程中抓取可用價格欄位
  const potCost = state.plants.reduce((s,x)=>{
    const history = Array.isArray(x.moveHistory) ? x.moveHistory : [];
    return s + history.reduce((a,h)=>a+(Number(h.cost)||Number(h.price)||0),0);
  },0);

  // 其他：把耗材、盆器、堆肥與雜項支出都併入「其他」，花費結構只保留三大類。
  const otherCost = Math.max(0, (state.expenses || []).reduce((s,x)=>s+(Number(x.amount)||0),0))
    + consumableCost + potCost + compostCost;

  const categories = [
    {name:"植物購買", value:Math.round(plantCost), icon:"fa-seedling"},
    {name:"工具", value:Math.round(toolCost), icon:"fa-screwdriver-wrench"},
    {name:"其他", value:Math.round(otherCost), icon:"fa-ellipsis"}
  ];

  const totalCost = categories.reduce((s,x)=>s+x.value,0);
  const chartColors = ["#059669","#f97316","#78716c"];

  // 植物售出：獨立於花費結構之外的收入明細，依日期新到舊排序。
  const soldRows = state.sales.filter(s=>!s.voided).map(s=>({
    title: s.target || "植物",
    sub: `${s.buyer?`買家：${s.buyer}　·　`:""}${s.date||"未填日期"}`,
    amount: Number(s.salePrice)||0,
    date: s.date||""
  })).sort((a,b)=>(b.date||"").localeCompare(a.date||""));

  // SVG 圓餅圖：不依賴第三方圖表套件
  let currentAngle = -90;
  const slices = categories.map((c,i)=>{
    const pct = totalCost ? c.value/totalCost : 0;
    const startAngle = currentAngle;
    const endAngle = currentAngle + pct*360;
    currentAngle = endAngle;

    const polar = (angle, radius) => {
      const rad = angle*Math.PI/180;
      return [100 + radius*Math.cos(rad), 100 + radius*Math.sin(rad)];
    };

    let path = "";
    if(pct >= 0.9999){
      path = `<circle cx="100" cy="100" r="78" fill="${chartColors[i]}"></circle>`;
    } else if(pct > 0){
      const [sx,sy] = polar(startAngle,78);
      const [ex,ey] = polar(endAngle,78);
      const large = endAngle-startAngle > 180 ? 1 : 0;
      path = `<path d="M 100 100 L ${sx} ${sy} A 78 78 0 ${large} 1 ${ex} ${ey} Z" fill="${chartColors[i]}"></path>`;
    }
    return {...c,pct,path,color:chartColors[i]};
  });

  const chart = totalCost
    ? slices.map(s=>s.path).join("")
    : `<circle cx="100" cy="100" r="78" fill="#e7e5e4"></circle>`;

  const legend = slices.map(s=>{
    const percent = totalCost ? Math.round(s.pct*100) : 0;
    return `
      <button onclick="showExpenseCategory('${s.name}')"
        class="w-full flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 hover:bg-stone-50 transition text-left">
        <span class="flex items-center gap-2 min-w-0">
          <span class="w-3 h-3 rounded-full shrink-0" style="background:${s.color}"></span>
          <i class="fa-solid ${s.icon} text-stone-400 w-4"></i>
          <span class="text-xs text-stone-700 truncate">${s.name}</span>

        <span class="text-right shrink-0">

          <span class="text-[10px] text-stone-400 ml-1">${percent}%</span>
        </span>

  }).join("");

  const top = [...slices].sort((a,b)=>b.value-a.value)[0];
  const insight = top && top.value > 0

          <p class="text-xs text-stone-400">總花費</p>

          <p class="text-[10px] text-stone-400 mt-1">目前紀錄</p>

  const box = document.getElementById("expense-category-detail");
  if(!box) return;

  let rows = [];

  if(category==="植物購買"){
    rows = state.plants.map(p=>({
      title:p.name,
      sub:`${p.species} · ${p.acquireDate || "－"}`,
      amount:Number(p.price)||0,
      icon:"fa-seedling"
    })).filter(x=>x.amount>0);
  }else if(category==="工具"){
    rows=(state.tools||[]).map(t=>({
      title:t.name||"工具",
      sub:t.source?`來源：${t.source}`:"未填寫來源",
      amount:Number(t.purchasedTotal) ?? ((Number(t.qty)||0)*(Number(t.unitCost)||0)),
      icon:"fa-screwdriver-wrench"
    })).filter(x=>x.amount>0);
  }else if(category==="其他"){
    rows=(state.expenses||[]).map(e=>({
      title:e.name||e.title||"其他支出",
      sub:e.date||"其他紀錄",
      amount:Number(e.amount)||0,
      icon:"fa-ellipsis"
    })).filter(x=>x.amount>0);
    // 併入耗材採購
    (state.materials||[]).forEach(m=>{
      const history=Array.isArray(m.purchaseHistory)&&m.purchaseHistory.length
        ? m.purchaseHistory
        : [{date:"－",qty:m.stock,unit:m.unit,totalCost:Number(m.purchaseTotalCost)||((Number(m.stock)||0)*(Number(m.unitCost)||0))}];
      history.forEach(r=>{
        const amount=Number(r.totalCost)||0;
        if(amount>0) rows.push({title:m.name||"耗材",sub:`耗材採購 · ${r.date||"－"} · ${Number(r.qty)||0}${r.unit||m.unit||""}`,amount,icon:"fa-toolbox"});
      });
    });
    // 併入盆器
    state.plants.forEach(p=>{
      (p.moveHistory||[]).forEach(h=>{
        const amount=Number(h.cost)||Number(h.price)||0;
        if(amount>0) rows.push({title:`${p.name} · ${h.potSize||"－"}吋盆`,sub:`盆器 · ${h.date||"盆器紀錄"}`,amount,icon:"fa-box"});
      });
    });
    // 併入堆肥
    state.compostBins.forEach(bin=>{
      (bin.inputs||[]).forEach(i=>{
        const amount=Number(i.cost)||0;
        if(amount>0) rows.push({title:i.material||"堆肥材料",sub:`堆肥 · ${bin.name||"堆肥箱"} · ${i.date||"－"}`,amount,icon:"fa-recycle"});
      });
    });
  }

  rows = rows.map(r=>({...r, amount:Math.round(r.amount)}));
  const total=rows.reduce((s,x)=>s+x.amount,0);
  box.innerHTML=`
    <div class="flex items-center justify-between gap-3">
      <div>
        <h2 class="font-serif-cjk text-lg font-bold text-stone-800">📋 ${category}明細</h2>
        <p class="text-xs text-stone-400 mt-1">共 ${rows.length} 筆 · 合計 $${total.toLocaleString()}</p>
      </div>
      <button onclick="renderReports()" class="text-xs text-stone-400 hover:text-emerald-700">清除篩選</button>
    </div>
    <div class="mt-4">
      ${rows.length ? rows.map(r=>`
        <div class="flex items-center justify-between gap-3 py-3 border-b border-stone-100 last:border-0">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 grid place-items-center shrink-0">
              <i class="fa-solid ${r.icon}"></i>
            </span>
            <div class="min-w-0">
              <p class="text-sm text-stone-700 truncate">${esc(r.title)}</p>
              <p class="text-[10px] text-stone-400 truncate">${esc(String(r.sub))}</p>
            </div>
          </div>
          <b class="text-sm text-stone-700 shrink-0">$${r.amount.toLocaleString()}</b>
        </div>`).join("")
      : `<div class="rounded-2xl bg-stone-50 p-6 text-center text-xs text-stone-400">目前沒有可顯示的${category}花費紀錄。</div>`}
    </div>`;
}

function getSpeechRecognition(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}
function chineseNumberToArabic(text){
  const s=String(text||"").trim();
  if(!/[零〇一二兩三四五六七八九十百千萬億]/.test(s)) return s;
  const digit={"零":0,"〇":0,"一":1,"二":2,"兩":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
  const unit={"十":10,"百":100,"千":1000,"萬":10000,"億":100000000};
  let total=0, section=0, number=0;
  for(const ch of s){
    if(Object.prototype.hasOwnProperty.call(digit,ch)){ number=digit[ch]; continue; }
    if(unit[ch]){
      const u=unit[ch];
      if(u<10000){ section += (number||1)*u; number=0; }
      else { section += number; total += section*u; section=0; number=0; }
    }
  }
  return String(total+section+number);
}
function startFieldVoice(inputId){
  const SR=getSpeechRecognition();
  if(!SR){showToast("此瀏覽器沒有啟用語音辨識，請用最新版 Chrome／Edge","fa-microphone-slash");return;}
  const input=document.getElementById(inputId);
  if(!input) return;
  try{
    const r=new SR();
    r.lang="zh-TW"; r.interimResults=false; r.continuous=false; r.maxAlternatives=1;
    r.onstart=()=>showToast("🎙️ 請開始說話…","fa-microphone");
    r.onresult=e=>{
      let text=(e.results?.[0]?.[0]?.transcript||"").trim();
      if(input.type==="number") text=chineseNumberToArabic(text).replace(/[^0-9.]/g,"");
      input.value=text;
      input.dispatchEvent(new Event("input",{bubbles:true}));
    };
    r.onerror=e=>{
      const msg=e.error==="not-allowed"?"麥克風權限被拒絕，請允許此網頁使用麥克風":e.error==="no-speech"?"沒有聽到聲音，請再說一次":"語音辨識失敗，請再試一次";
      showToast(msg,"fa-triangle-exclamation");
    };
    r.onend=()=>{};
    r.start();
  }catch(err){ showToast("無法啟動麥克風，請確認瀏覽器已允許麥克風權限","fa-microphone-slash"); }
}
function startMainVoiceRecording(){
  const SR=getSpeechRecognition();
  if(!SR){showToast("此瀏覽器沒有啟用語音辨識，請用最新版 Chrome／Edge","fa-microphone-slash");return;}
  try{
    const r=new SR();
    r.lang="zh-TW"; r.interimResults=false; r.continuous=false; r.maxAlternatives=1;
    state.voice.listening=true; renderVoice();
    r.onresult=e=>{
      state.voice.text=(e.results?.[0]?.[0]?.transcript||"").trim();
    };
    r.onerror=e=>{
      state.voice.listening=false; renderVoice();
      const msg=e.error==="not-allowed"?"麥克風權限被拒絕，請允許此網頁使用麥克風":e.error==="no-speech"?"沒有聽到聲音，請再說一次":"語音辨識失敗，請再試一次";
      showToast(msg,"fa-triangle-exclamation");
    };
    r.onend=()=>{ state.voice.listening=false; renderVoice(); };
    r.start();
    showToast("🎙️ 請開始說話…","fa-microphone");
  }catch(err){ state.voice.listening=false; renderVoice(); showToast("無法啟動麥克風，請確認瀏覽器已允許麥克風權限","fa-microphone-slash"); }
}

    r.classList.remove("hidden"); r.classList.add("flex");
  }
  else if(action==="api-toggle" || el.id==="api-toggle"){ /* handled below */ }
});

document.getElementById("api-toggle").addEventListener("click", function(){
  state.apiOffline = !state.apiOffline;
  render();
});

/* =========================================================================
   初始化
========================================================================= */
render();
</script>

  function enhanceMaterials(){
    originalRenderMaterials.call(window);
    const root=document.getElementById('main-content');
    const inventoryCard=root.querySelector('section');
    if(!inventoryCard) return;
    const totalTools = state.tools.reduce((n,t)=>n+(Number(t.qty)||0),0);
    const lowTools = state.tools.filter(t=>(Number(t.qty)||0)<=1).length;

  function renderToolsAndMaterials(){
    const root=document.getElementById('main-content');
    if(!root) return;

    const totalTools=state.tools.reduce((n,t)=>n+(Number(t.qty)||0),0);
    const lowTools=state.tools.filter(t=>(Number(t.qty)||0)<=1).length;
    const normalTools=state.tools.filter(t=>(Number(t.qty)||0)>1).length;
    const toolsPurchasedTotal=state.tools.reduce((n,t)=>n+(Number(t.purchasedTotal)??((Number(t.qty)||0)*(Number(t.unitCost)||0))),0);
    const totalMaterialUnits=state.materials.reduce((n,m)=>n+(Number(m.stock)||0),0);

    /* ===== 耗材／資材：與原本 renderMaterials() 完全相同的計算方式，只是換一套版面 ===== */
    const totalMaterialCost = state.materials.reduce((sum,m)=>sum+(Array.isArray(m.batches)?m.batches.reduce((x,b)=>x+(Number(b.remainingQty)||0)*(Number(b.unitCost)||0),0):(Number(m.stock)||0)*(Number(m.unitCost)||0)),0);
    const usedMaterialCost = state.materials.reduce((s,m)=>s+(Number(m.usedCost)||0),0);
    const purchasedMaterialCost = state.materials.reduce((s,m)=>s+(Number(m.purchaseTotalCost)||((Number(m.stock)||0)*(Number(m.unitCost)||0)),0),0);

    /* ===== 合併檢視：資源種類、投入總值一律用「累計投入成本」，使用 1 只扣庫存數量，不會讓總值跟著變少 ===== */
    const resourceKindCount = state.tools.length + state.materials.length;
    const combinedInvestedValue = toolsPurchasedTotal + purchasedMaterialCost;
    const lowStockCount = state.tools.filter(t=>(Number(t.qty)||0)<=1).length + state.materials.filter(m=>(Number(m.stock)||0)<=0).length;

    const materialCardsRaw=state.materials.map(m=>{

          </div>
        </div>

        <div class="material-stats-v3">
          <div class="material-stat-box">
            <span>目前庫存</span>
            <b>${m.stock}</b>
          </div>
          <div class="material-stat-box">
            <span>採購價</span>
            <b>$${(Number(m.unitCost)||0).toLocaleString()}</b>

        <div class="tool-card-v3-divider"></div>
        <div class="tool-card-v3-bottom tool-card-v3-bottom-end">

            <span>－</span><span>使用 1</span>
          </button>
        </div>

                <button type="button" data-ext-action="edit-tool" data-id="${t.id}" title="編輯" class="card-edit-btn">✏️</button>

            <span>－</span><span>${qty<=0?'已用完':'使用 1'}</span>
          </button>
        </div>
      </article>` };

  function renderCompostPage(){
    const root=document.getElementById('main-content'); if(!root)return;
    const bins=state.compostBins||[];
    const totalInputs=bins.reduce((n,b)=>n+(b.inputs?.length||0),0);
    const totalWeight=bins.reduce((n,b)=>n+(b.inputs||[]).reduce((s,i)=>s+(Number(i.weight)||0),0),0);
    const completed=bins.filter(b=>b.status==='完成').length;
    const active=bins.filter(b=>b.status!=='完成').length;
    const presetOptions=state.cnPresets.map(c=>`<option value="${esc2(c.name)}">${esc2(c.name)}</option>`).join('');
    const cards=bins.map(bin=>{
      const inputs=Array.isArray(bin.inputs)?bin.inputs:[];
      const ratio=binCNRatio(bin);
      const total=inputs.reduce((s,i)=>s+(Number(i.weight)||0),0);
      const target=Number(bin.targetWeight)||0;
      const pct=target?Math.min(100,Math.round(total/target*100)):0;
      const remaining=Math.max(0,target-total);
      const humidity=bin.humidity==null?'':Number(bin.humidity);
      const status=bin.status||'進行中';
      const statusClass=status==='完成'?'done':status==='需調整'?'adjust':'';
      const history=inputs.slice().reverse().map(i=>`<div class="compost-input-row"><span>${esc2(i.material)}</span><b>${Number(i.weight)||0}g</b><small>${esc2(i.date||'')}</small></div>`).join('')||`<div class="compost-empty">尚無投入紀錄</div>`;
      const photos=(bin.photos||[]).slice(-4).reverse().map(ph=>`<img src="${ph.url}" alt="堆肥狀態" class="compost-photo">`).join('');
      return `<article class="compost-bin-card">
        <div class="compost-bin-head"><div><span class="compost-bin-type">${esc2(bin.type||'高溫')}</span><h2>${esc2(bin.name)}</h2><p>${inputs.length} 次投入 · 累積 ${total.toLocaleString()}g</p></div><span class="compost-status ${statusClass}">${esc2(status)}</span></div>
        <div class="compost-kpis"><div><span>碳氮比</span><b>${ratio==null?'－':ratio+':1'}</b></div><div><span>濕度</span><b>${humidity===''?'－':humidity+'%'}</b></div><div><span>目標量</span><b>${target?target.toLocaleString()+'g':'未設定'}</b></div></div>
        ${target?`<div class="compost-progress"><div><span>投入進度</span><b>${total.toLocaleString()}g / ${target.toLocaleString()}g</b></div><div class="bar"><i style="width:${pct}%"></i></div><small>${remaining?`還差 ${remaining.toLocaleString()}g`:'已達成目標量'}</small></div>`:''}
        ${ratio!=null&&ratio<25?`<div class="compost-alert"><i class="fa-solid fa-triangle-exclamation"></i> 氮含量偏高，建議加入落葉、木屑等乾料。</div>`:''}

        <div class="compost-history"><div class="compost-subhead"><b>投入紀錄</b><span>${inputs.length} 筆</span></div>${history}</div>
        <div class="compost-fields"><label>目前濕度（%）<input data-compost-field="humidity" data-id="${bin.id}" type="number" min="0" max="100" value="${humidity}" class="${extInput}" placeholder="例如 60"></label><label>完成日期<input data-compost-field="finishedDate" data-id="${bin.id}" type="date" value="${esc2(bin.finishedDate||'')}" class="${extInput}"></label><label>狀態<select data-compost-field="status" data-id="${bin.id}" class="${extInput}"><option ${status==='進行中'?'selected':''}>進行中</option><option ${status==='完成'?'selected':''}>完成</option><option ${status==='需調整'?'selected':''}>需調整</option></select></label><label>目前狀態<input data-compost-field="condition" data-id="${bin.id}" value="${esc2(bin.condition||'')}" class="${extInput}" placeholder="例如：成熟、鬆軟、下陷"></label><label class="compost-field-full">用途／備註<textarea data-compost-field="effectiveness" data-id="${bin.id}" class="${extInput} compost-effectiveness-textarea" placeholder="例如：改良盆土">${esc2(bin.effectiveness||'')}</textarea></label></div>
        <label class="compost-photo-upload"><span><i class="fa-solid fa-camera"></i> 狀態照片</span><input data-compost-photo="${bin.id}" type="file" accept="image/*" class="${extInput}"></label>
        ${photos?`<div class="compost-photos">${photos}</div>`:''}
      </article>`;
    }).join('');
    root.innerHTML=`<div class="resource-page compost-page-shell space-y-5 fade-in"><section class="resource-hero compost-hero"><div><span class="resource-kicker">COMPOST MANAGEMENT</span><h1>♻️ 堆肥箱</h1><p>每個堆肥箱獨立追蹤投入材料、碳氮比、濕度、完成狀態與照片。</p></div><button data-action="open-add-compost-bin" class="resource-primary green"><i class="fa-solid fa-plus"></i> 新增堆肥箱</button></section>

  function chineseNumberToArabic(s){
    if(!s) return null;
    s=s.replace(/兩/g,'二');
    if(/^\d+(?:\.\d+)?$/.test(s)) return Number(s);
    const digit={零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    let total=0, section=0, num=0, has=false;
    for(const ch of s){
      if(digit[ch]!=null){num=digit[ch];has=true;continue;}
      if(ch==='十'){section += (num||1)*10;num=0;has=true;continue;}
      if(ch==='百'){section += (num||1)*100;num=0;has=true;continue;}
      if(ch==='千'){section += (num||1)*1000;num=0;has=true;continue;}
      if(ch==='萬'){total += (section+num)*10000;section=0;num=0;has=true;continue;}
    }
    return has ? total+section+num : null;
  }

  }

    const input=document.getElementById('ext-tool-custom-unit');
    const custom=unit.value==='自訂';
    if(wrap) wrap.classList.toggle('hidden',!custom);
    if(input) input.classList.toggle('hidden',!custom);
  });

  document.addEventListener('change',async function(e){
    const toolUnit=e.target.closest('#ext-tool-unit');
    if(toolUnit){ const custom=document.getElementById('ext-tool-custom-unit'); if(custom) custom.classList.toggle('hidden', toolUnit.value!=='自訂'); }
    const field=e.target.closest('[data-compost-field]');if(field){const b=state.compostBins.find(x=>x.id===field.dataset.id);if(b){b[field.dataset.compostField]=field.value; if(field.dataset.compostField==='humidity')b.humidity=Number(field.value)||0;extSave();showToast('堆肥資料已更新','fa-recycle');}}
    const matUnit=e.target.closest('[data-material-unit-select]');
    if(matUnit){
      const m=state.materials.find(x=>x.id===matUnit.dataset.id);
      if(m){
        const old=m.unit||'單位';
        const next=matUnit.value;
        m.unit=next;
        (m.batches||[]).forEach(b=>{ if(!b.unit) b.unit=old; });
        (m.purchaseHistory||[]).forEach(r=>{ if(!r.unit) r.unit=old; });
        extSave();
        showToast(`已將「${m.name}」目前顯示單位改為「${next}」`,'fa-ruler-combined');
        render();
      }
    }
    const photo=e.target.closest('[data-compost-photo]');if(photo){const b=state.compostBins.find(x=>x.id===photo.dataset.compostPhoto);const file=photo.files?.[0];if(b&&file){const url=await readImage(file);const ph={id:uid('ph'),url,date:todayStr(),eventType:'堆肥狀態',eventId:b.id,title:b.name};b.photos.push(ph);state.eventPhotos.push(ph);extSave();render();showToast('已新增堆肥照片','fa-camera');}}
  });

  // 完成「購入轉售」欄位：若手動新增 sale，來源型態與利潤仍可追蹤。
  const oldOpenModal=window.openModal;
  window.openModal=function(type,payload){
    if(type==='addSale'){
      oldOpenModal.call(window,type,payload);
      setTimeout(()=>{
        const root=document.getElementById('modal-root'); if(!root)return;
        const holder=root.querySelector('#sl-buyer')?.closest('.grid')||root;
        if(document.getElementById('sl-source-type'))return;
        const f=document.createElement('div');f.className='mt-3';f.innerHTML=`<label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">出售來源</span><select id="sl-source-type" class="${extInput}"><option value="self-propagated">自行繁殖</option><option value="purchase-resale">購入轉售</option></select></label>`;holder.appendChild(f);
      },30);return;
    }
    if(type==='addMaterial'){
      oldOpenModal.call(window,type,payload);
      setTimeout(()=>{
        const root=document.getElementById('modal-root'); if(!root)return;
        if(document.getElementById('mat-source'))return;
        const costInput=document.getElementById('mat-cost');
        const holder=costInput?.closest('label')?.parentElement;
        if(!holder)return;
        const f=document.createElement('div');
        f.innerHTML=`<label class="block"><span class="text-xs font-medium text-stone-500 mb-1 block">來源</span><input id="mat-source" class="${extInput}" placeholder="例如：花市、園藝資材行、網路賣家"></label>`;
        costInput.closest('label')?.insertAdjacentElement('afterend', f.firstElementChild);
      },30);return;
    }
    return oldOpenModal.apply(window,arguments);
  };
  const oldAddSaleSubmit=window.addSaleSubmit;
  window.addSaleSubmit=function(target,salePrice,cost,buyer){
    oldAddSaleSubmit.call(window,target,salePrice,cost,buyer);
    const sourceType=document.getElementById('sl-source-type')?.value||'self-propagated';
    const s=state.sales[state.sales.length-1];if(s){s.sourceType=sourceType;s.originalCost=Number(cost)||0;s.profit=(Number(salePrice)||0)-(Number(cost)||0);}
    extSave();
  };
  const oldPurchaseMaterialSubmit=window.purchaseMaterialSubmit;
  window.purchaseMaterialSubmit=function(name,qty,unit,cost,force){
    const source=document.getElementById('mat-source')?.value.trim()||'';
    oldPurchaseMaterialSubmit.call(window,name,qty,unit,cost,force);
    const target=state.materials.find(x=>x.name.trim()===String(name).trim());
    if(target && source){ target.source=source; extSave(); }
  };

  setTimeout(()=>{extInit();if(typeof window.render==='function')window.render();},0);
})();
</script>
<script>
/* ===== 規格補齊第二層：跨花市比價、作物 ROI、事件照片、銷售來源修正 ===== */
(function(){
  const _renderMarket = window.renderMarket;
  const _renderSales = window.renderSales;
  const _oldAddSaleSubmit = window.addSaleSubmit;
  const _renderDashboard = window.renderDashboard;

  // 依需求移除首頁「目前進度」（成長／等級稱號）區塊，其餘首頁內容維持原樣。
  window.renderDashboard = function(){
    _renderDashboard.call(window);
    const root=document.getElementById('main-content'); if(!root) return;
    [...root.querySelectorAll('h2')].forEach(h=>{
      if((h.textContent||'').trim()==='目前進度'){
        const section=h.closest('section');
        if(section) section.remove();
      }
    });
  };

  window.renderMarket = function(){
    _renderMarket.call(window);
  };

  window.renderSales = function(){
    state.crops.forEach(c=>{ if(c.unitValue==null) c.unitValue=0; });
    _renderSales.call(window);
    const root=document.getElementById('main-content');
    const roi=state.crops.map(c=>{const total=c.harvests.reduce((s,h)=>s+(Number(h.amount)||0),0);const value=total*(Number(c.unitValue)||0);const profit=value-(Number(c.initialCost)||0);const rate=c.initialCost?((profit/c.initialCost)*100):0;return `<div class="rounded-2xl bg-stone-50 p-4"><div class="flex justify-between gap-2"><div><b class="text-sm">${esc(c.name)}</b><p class="text-[11px] text-stone-400">成本 $${Number(c.initialCost||0).toLocaleString()} · 累積 ${total}g</p></div><b class="text-sm ${rate>=0?'text-emerald-700':'text-red-600'}">ROI ${rate.toFixed(1)}%</b></div><div class="grid sm:grid-cols-[1fr_auto] gap-2 mt-3"><label class="text-[11px] text-stone-400">估算每克價值<input data-crop-unit-value="${c.id}" type="number" min="0" step="0.1" value="${Number(c.unitValue)||0}" class="${extInput} mt-1"></label><div class="rounded-xl bg-white px-3 py-2 text-xs text-stone-500">估算產值 <b class="text-stone-700">$${Math.round(value).toLocaleString()}</b><br>估算效益 <b class="${profit>=0?'text-emerald-700':'text-red-600'}">$${Math.round(profit).toLocaleString()}</b></div></div></div>`;}).join('');
    root.insertAdjacentHTML('beforeend', extCard('可食用作物成本效益','用採收量 × 單位估值，提供簡易投入產出參考',`<div class="space-y-2">${roi||'<p class="text-sm text-stone-400">尚無作物。</p>'}</div>`,'emerald'));
  };

  // 讓手動銷售也保存來源類型；讀取表單欄位要在舊函式關閉 modal 前完成。
  window.addSaleSubmit=function(target,salePrice,cost,buyer){
    const sourceType=document.getElementById('sl-source-type')?.value||'self-propagated';
    _oldAddSaleSubmit.call(window,target,salePrice,cost,buyer);
    const s=state.sales[state.sales.length-1]; if(s){s.sourceType=sourceType;s.originalCost=Number(cost)||0;s.profit=(Number(salePrice)||0)-(Number(cost)||0);}
    if(typeof saveState==='function')saveState();
  };

  document.addEventListener('change',e=>{
    const cv=e.target.closest('[data-crop-unit-value]');
    if(cv){const c=state.crops.find(x=>x.id===cv.dataset.cropUnitValue);if(c){c.unitValue=Number(cv.value)||0;saveState();}}
  });

  // 事件照片快速綁定：從事件相簿頁可把照片加到任一植物事件。
  const _renderAlbum=window.renderAlbum;
  window.renderAlbum=function(){
    _renderAlbum.call(window);
    const root=document.getElementById('main-content');
    root.insertAdjacentHTML('beforeend', extCard('事件照片新增','把照片直接綁定到植物的換盆／分株／死亡／生長事件',`<div class="grid sm:grid-cols-2 gap-3"><select id="ext-event-plant" class="${extInput}">${state.plants.map(p=>`<option value="${p.id}">${esc(p.id)} · ${esc(p.name)}</option>`).join('')}</select><select id="ext-event-type" class="${extInput}"><option>換盆</option><option>分株</option><option>死亡</option><option>生長／澆水</option><option>出售</option></select><input id="ext-event-photo" type="file" accept="image/*" class="${extInput} sm:col-span-2"><button data-ext-action="save-event-photo" class="sm:col-span-2 bg-gradient-to-r from-emerald-500 to-emerald-700 text-white px-4 py-2.5 rounded-xl">綁定照片到事件</button></div>`,'blue'));
  };
  document.addEventListener('click',async e=>{const el=e.target.closest('[data-ext-action="save-event-photo"]');if(!el)return;const pid=document.getElementById('ext-event-plant').value;const type=document.getElementById('ext-event-type').value;const file=document.getElementById('ext-event-photo').files?.[0];const p=state.plants.find(x=>x.id===pid);if(!p||!file)return;try{const url=await (new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=ev=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82));};img.onerror=reject;img.src=ev.target.result;};reader.readAsDataURL(file);}));const eventId=uid('evt');const ph={id:uid('ph'),url,date:todayStr(),eventType:type,eventId,plantId:pid,title:p.name};p.photos.push(ph);state.eventPhotos.push(ph);p.events=p.events||[];p.events.push({id:eventId,type,date:todayStr(),note:'事件照片'});saveState();showToast('事件照片已綁定','fa-camera');render();}catch(err){showToast('照片處理失敗','fa-triangle-exclamation');}});

  extInit();
  setTimeout(()=>{if(typeof window.render==='function')window.render();},0);
})();
</script>
</body>
</html>
